<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Din</title>
<meta name="description" content="Din: controle de gastos com lançamento por voz.">
<meta name="theme-color" content="#F5F6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0F0D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna. Barra superior com o mês, conteúdo em listas agrupadas, barra de navegação embaixo com o microfone no centro. Um só acento verde; cores das categorias só em pontos pequenos. */
:root{
  --bg:#F5F6F4; --surface:#FFFFFF; --sunk:#ECEEEA; --line:#E3E6E1;
  --fg:#101512; --muted:#6A746E; --faint:#9AA39D;
  --accent:#0D7A5B; --accent-fg:#FFFFFF; --accent-soft:#E2F1EB;
  --danger:#C23A2E; --danger-soft:#FBE7E4; --warn:#A35F00; --warn-soft:#FDF0DA;
  --c-alim:#D06A2E; --c-aluguel:#3F6BB5; --c-energia:#D2A41C; --c-agua:#2593AE; --c-net:#7A5DB0;
  --c-transp:#97764A; --c-saude:#C74A5C; --c-lazer:#DD8240; --c-educ:#4C8B47; --c-compras:#AE5498;
  --c-emprest:#6B7077; --c-outros:#9AA39D;
  --c-pets:#B5713A; --c-filhos:#3E9C8F; --c-beleza:#C2527F; --c-casa:#6F7F3A; --c-familia:#5C6FC4; --c-impostos:#8A5A44;
  --c-x1:#2F8F6F; --c-x2:#B0603A; --c-x3:#5868B8; --c-x4:#A84E8C; --c-x5:#8C8A2E; --c-x6:#3C8FB0;
  --f:"Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-display:var(--f); --f-body:var(--f); --f-num:var(--f);
  --r:18px; --r-s:12px;
  --nav-h:68px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C0F0D; --surface:#151916; --sunk:#1D221F; --line:#252B27;
  --fg:#EDF1EE; --muted:#8D9892; --faint:#5F6963;
  --accent:#46CFA2; --accent-fg:#03241A; --accent-soft:#12302A;
  --danger:#FF8B80; --danger-soft:#3A1B18; --warn:#F2B75E; --warn-soft:#33270F;
  --c-alim:#EE8A50; --c-aluguel:#7AA1E6; --c-energia:#EAC748; --c-agua:#5AC4DD; --c-net:#AD93DE;
  --c-transp:#CDA673; --c-saude:#F07D8E; --c-lazer:#F4A061; --c-educ:#82C47C; --c-compras:#DE86C7;
  --c-pets:#DD9A62; --c-filhos:#5FC7B8; --c-beleza:#EE80AB; --c-casa:#A8BA62; --c-familia:#8C9CF0; --c-impostos:#C98F74;
  --c-x1:#5AC9A1; --c-x2:#E7915F; --c-x3:#8F9CF0; --c-x4:#DE86C4; --c-x5:#CFCB5E; --c-x6:#6CC3E6;
  --c-emprest:#A8AEB5; --c-outros:#76817A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C0F0D; --surface:#151916; --sunk:#1D221F; --line:#252B27;
  --fg:#EDF1EE; --muted:#8D9892; --faint:#5F6963;
  --accent:#46CFA2; --accent-fg:#03241A; --accent-soft:#12302A;
  --danger:#FF8B80; --danger-soft:#3A1B18; --warn:#F2B75E; --warn-soft:#33270F;
  --c-alim:#EE8A50; --c-aluguel:#7AA1E6; --c-energia:#EAC748; --c-agua:#5AC4DD; --c-net:#AD93DE;
  --c-transp:#CDA673; --c-saude:#F07D8E; --c-lazer:#F4A061; --c-educ:#82C47C; --c-compras:#DE86C7;
  --c-pets:#DD9A62; --c-filhos:#5FC7B8; --c-beleza:#EE80AB; --c-casa:#A8BA62; --c-familia:#8C9CF0; --c-impostos:#C98F74;
  --c-x1:#5AC9A1; --c-x2:#E7915F; --c-x3:#8F9CF0; --c-x4:#DE86C4; --c-x5:#CFCB5E; --c-x6:#6CC3E6;
  --c-emprest:#A8AEB5; --c-outros:#76817A; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.45;margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.sheet-open{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h3{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.label{font-size:13px;color:var(--muted);font-weight:500}
.hint{font-size:13px;color:var(--muted);margin:0}
.hint.alert{color:var(--warn)}
.pos{color:var(--accent)} .neg{color:var(--danger)} .muted{color:var(--muted)}

/* barra superior */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.appbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{width:40px;height:40px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;color:var(--muted)}
.month button:hover{background:var(--sunk)}
.month strong{font-weight:600;min-width:92px;text-align:center;text-transform:capitalize;font-size:15px}
.expill{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:4px 4px 4px 10px}
.expill button{border:0;background:var(--surface);color:var(--warn);border-radius:999px;padding:3px 10px;font-weight:600;font-size:12.5px}

main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:10px}
.sec{font-size:13px;color:var(--muted);font-weight:500;margin:18px 2px 0}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 2px 0}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13.5px;padding:4px 0}

/* destaque (sobra do mês) */
.hero{background:var(--surface);border-radius:var(--r);padding:20px 18px 16px;display:grid;gap:12px}
.hero-label{font-size:14px;color:var(--muted);font-weight:500}
.hero-num{font-size:clamp(40px,12vw,54px);font-weight:700;line-height:1;letter-spacing:-.035em;margin-top:-4px}
.hero-num small{font-size:.4em;font-weight:600;color:var(--muted);margin-right:6px;letter-spacing:0;vertical-align:.55em}
.hero-num.neg small{color:var(--danger)}
.meter{position:relative;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--accent)}
.meter i.warn{background:var(--warn)} .meter i.over{background:var(--danger)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{display:grid;gap:1px;min-width:0}
.trio span{font-size:12.5px;color:var(--muted)}
.trio b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-foot{font-size:13px;color:var(--muted);padding-top:10px;border-top:1px solid var(--line)}
.hero-foot b{color:var(--fg);font-weight:600}
.hero-foot b.neg{color:var(--danger)}
.today{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 0 0;font-size:13.5px;color:var(--muted)}
.today>span:first-child{color:var(--fg);font-weight:600}
.today b{color:var(--fg);font-weight:600}
.chev{width:16px;height:16px;margin-left:auto;fill:none;stroke:var(--faint);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ask{display:grid;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.ask>span{font-weight:600}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-s);padding:12px;display:grid;gap:2px}
.choice button strong{font-weight:600}
.choice button span{font-size:12.5px;color:var(--muted)}

/* listas agrupadas */
.list,.box{background:var(--surface);border-radius:var(--r);overflow:hidden}
.box{padding:2px 16px}
.row,.alert-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:13px 16px;border:0;background:transparent;width:100%;text-align:left}
.list>*+*{border-top:1px solid var(--line)}
.row .t,.alert-row .t{min-width:0;font-weight:500}
.row small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.alert-row{grid-template-columns:auto 1fr auto}
.alert-row .num{font-weight:600;font-size:14px}
.sig{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.sig.bad{background:var(--danger)}
.icon-btn{width:40px;height:40px;border:0;border-radius:8px;background:transparent;color:var(--faint);font-size:19px;line-height:1}
.icon-btn:hover{background:var(--sunk);color:var(--danger)}

/* categorias */
.cat-row{display:grid;grid-template-columns:auto 1fr auto;gap:5px 12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.cat-row:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.cat-name{font-weight:500;min-width:0}
.cat-val{font-weight:600;font-variant-numeric:tabular-nums}
.bar{grid-column:2/4;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.bar i.warn{background:var(--warn)!important} .bar i.over{background:var(--danger)!important}
.cat-meta{grid-column:2/4;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.cmp{font-weight:500}
.cmp.up{color:var(--danger)} .cmp.down{color:var(--accent)}
.limrow{display:grid;grid-template-columns:auto 1fr 112px;gap:10px;align-items:center;font-size:14px}
.limrow input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}

/* gráfico */
.chart-wrap{background:var(--surface);border-radius:var(--r);padding:14px 14px 10px;overflow-x:auto;display:grid;gap:6px}
.chart-wrap svg{display:block;width:100%;min-width:290px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* cartões genéricos (cartão de crédito, empréstimo, meta) */
.card{border-radius:var(--r);padding:16px;background:var(--surface);display:grid;gap:10px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.fatura{display:flex;justify-content:space-between;align-items:end;gap:10px}
.fatura .num{font-size:24px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.fatura{flex-wrap:wrap}
.limit,.goalbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.limit i,.goalbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.mini{display:grid;gap:7px;font-size:13.5px}
.mini div{display:flex;justify-content:space-between;gap:10px}
.mini span:first-child{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:6px;padding:1px 5px;margin-left:4px}
.bill{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:13px 16px}
.bill b{font-weight:600;min-width:0}
.bill .num{font-weight:600}
.bill .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bill.paid{opacity:.6}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.statgrid div{background:var(--surface);border-radius:var(--r-s);padding:11px 12px;display:grid;gap:2px;min-width:0}
.statgrid .num{font-weight:600;font-size:15px}
.goal-day{display:grid;gap:10px;background:var(--surface);border-radius:var(--r);padding:18px}
.goal-day .big{font-size:34px;font-weight:700;line-height:1;letter-spacing:-.03em}
.dayrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--surface);border-radius:var(--r-s);padding:12px 14px}
.dayrow .d{font-weight:600}
.dayrow .d::first-letter,.day::first-letter{text-transform:uppercase}
.dayrow .l{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.dayrow .s{font-size:12.5px;color:var(--muted);grid-column:1/3}
.dayrow .split{grid-column:1/3;height:4px;border-radius:2px;background:var(--sunk);display:flex;overflow:hidden;gap:2px}
.dayrow .split i{display:block;height:100%;border-radius:2px}

/* botões e formulários */
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;background:var(--sunk);border-radius:var(--r-s);padding:10px 15px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;padding-inline:8px}
.btn.small{padding:7px 12px;font-size:13px}
.btn.danger{color:var(--danger)}
.add-form{display:grid;gap:12px;background:var(--surface);border-radius:var(--r);padding:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.field{display:grid;gap:5px;min-width:0}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;min-width:0}
.inline-save{display:flex;gap:8px}
.inline-save input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px}
.empty{color:var(--muted);text-align:center;padding:26px 16px;background:var(--surface);border-radius:var(--r);font-size:14px}
.empty b{color:var(--fg);font-weight:600}

/* segmentos da carteira */
.seg{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:12px;margin-top:2px}
.seg button{flex:1;border:0;background:transparent;padding:11px 6px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.panel{display:grid;gap:10px}

/* histórico */
.day{font-size:13px;color:var(--muted);font-weight:500;margin:12px 2px 0}
.tx{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:var(--surface);border-radius:var(--r-s);padding:8px 4px 8px 14px;cursor:pointer;min-height:56px}
.tx:hover{background:var(--sunk)}
.tx .t{min-width:0}
.tx .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t span{font-size:12.5px;color:var(--muted)}
.tx .num{font-weight:600}
.tx .del{border:0;background:transparent;color:var(--faint);width:40px;height:40px;border-radius:8px;font-size:18px;line-height:1}
.tx .del:hover{color:var(--danger);background:var(--sunk)}

/* navegação inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar-in{max-width:560px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center}
.tabbar [data-tab]{border:0;background:transparent;display:grid;justify-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--faint);padding:8px 0}
.tabbar [data-tab] svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar [aria-current="page"]{color:var(--fg)}
.mic{justify-self:center;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 18px rgba(13,122,91,.32),0 0 0 5px var(--bg)}
.mic svg,.sheet-mic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* painel de lançar */
.sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-bg{position:absolute;inset:0;background:rgba(8,12,10,.42);border:0}
.sheet-in{position:relative;width:100%;min-width:0;grid-template-columns:minmax(0,1fr);background:var(--surface);border-radius:22px 22px 0 0;max-height:88vh;overflow-y:auto;display:grid;gap:12px;
  padding-top:10px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet-in{animation:none}}
.sheet-inner{max-width:560px;width:100%;min-width:0;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.sheet-inner>*{min-width:0}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);justify-self:center}
.sheet-top{display:flex;justify-content:space-between;align-items:center}
.sheet-top h3{font-size:18px}
.say{display:flex;gap:8px;align-items:center}
.sheet-mic{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;position:relative}
.sheet-mic.on{background:var(--accent);color:var(--accent-fg)}
.sheet-mic.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--accent);animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{opacity:.9;transform:scale(.92)}to{opacity:0;transform:scale(1.25)}}
@media (prefers-reduced-motion: reduce){.sheet-mic.on::after{animation:none;opacity:.6}}
.say form{flex:1;display:flex;gap:8px;min-width:0}
.say input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 14px;font-size:16px}
.say .go{flex:none;border:0;background:var(--fg);color:var(--bg);border-radius:14px;padding:0 16px;font-weight:600}
.examples{min-width:0;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.examples button{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 14px;font-size:13px;color:var(--muted);white-space:nowrap}
.confirm{min-width:0;grid-template-columns:minmax(0,1fr);display:grid;gap:12px;border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--bg)}
.confirm .lead{display:grid;gap:2px}
.confirm .lead .label{font-weight:600;color:var(--fg);font-size:14px}
.multi-row{display:grid;grid-template-columns:auto 92px 1fr;gap:8px;align-items:center}
.multi-row select{grid-column:2/4}
.multi-row .sub{grid-column:2/4;font-size:12.5px;color:var(--muted)}
.multi-row input,.multi-row select{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.confirm .field input,.confirm .field select{background:var(--surface)}
.ai{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px;justify-self:start}

const BASE_CATS=[
 {id:"alimentacao",nome:"Alimentação",cor:"--c-alim",kw:["supermercado","mercado","mercadinho","padaria","acougue","feira","hortifruti","restaurante","lanche","lanchonete","ifood","pizza","comida","almoco","janta","jantar","cafe","cafe da manha","delivery","hamburguer","sacolao","atacadao","assai","carrefour","marmita","acai","sorvete","refri","refrigerante","pao","quitanda"]},

const mk=(y,m)=>{ y+=Math.floor(m/12); m=((m%12)+12)%12; return y+"-"+pad(m+1); };
const mkOf=iso=>String(iso).slice(0,7);
const addM=(key,n)=>{ const [y,m]=key.split("-").map(Number); return mk(y,m-1+n); };
const mesNome=key=>{ const [y,m]=key.split("-").map(Number); return MESES[m-1]; };
const ddmm=iso=>String(iso).slice(8,10)+"/"+String(iso).slice(5,7);

const LS="caderneta-v1";
// Cada pessoa tem sua própria caderneta, privada: data/users/<id>/config e .../config/gastos
const store={kind:"local",db:null,base:null,
  async run(fn,fallback){
    if(this.db){ try{ await fn(); return; }catch(e){ if(e&&e.code==="invalid_argument"&&!this.wrote){ this.toLocal(); } else throw e; } }
    fallback(); saveLocal(); render();
  },
  toLocal(){ this.db=null; this.kind="local"; (this.unsubs||[]).forEach(u=>{try{u()}catch(_){}}); toast("Salvando só neste aparelho"); },
  async setConfig(c){ await this.run(async()=>{await this.db.doc(this.base).set(c);this.wrote=true}, ()=>{state.config=c}); },
  async saveGasto(g){ await this.run(async()=>{await this.db.doc(this.base).collection("gastos").doc(g.id).set(g);this.wrote=true}, ()=>{state.gastos=state.gastos.filter(x=>x.id!==g.id);state.gastos.push(g)}); },
  async delGasto(id){ await this.run(async()=>{await this.db.doc(this.base).collection("gastos").doc(id).delete()}, ()=>{state.gastos=state.gastos.filter(g=>g.id!==id)}); },
  // restaurar cópia: "substituir" apaga o que não está na cópia; "juntar" só acrescenta/atualiza
  async restore(config,gastos,modo,progress){
    if(!this.db){
      if(modo==="substituir"){ state.config=config; state.gastos=gastos.slice(); }
      else { state.config=juntarConfig(cfg(),config); const ids=new Set(gastos.map(g=>g.id)); state.gastos=state.gastos.filter(g=>!ids.has(g.id)).concat(gastos); }
      saveLocal(); render(); return;
    }
    const col=this.db.doc(this.base).collection("gastos");
    await this.db.doc(this.base).set(modo==="substituir"?config:juntarConfig(cfg(),config));
    let n=0;
    if(modo==="substituir"){ const keep=new Set(gastos.map(g=>g.id)); for(const g of state.gastos.slice()) if(!keep.has(g.id)){ await col.doc(g.id).delete(); } }
    for(const g of gastos){ await col.doc(g.id).set(g); n++; if(progress&&n%10===0) progress(n); }
    this.wrote=true;
  },
  async apagarTudo(){
    if(!this.db){ state.config={}; state.gastos=[]; saveLocal(); render(); return; }
    const col=this.db.doc(this.base).collection("gastos");
    for(const g of state.gastos.slice()) await col.doc(g.id).delete();
    await this.db.doc(this.base).set({});
  }
};
function juntarConfig(a,b){
  const out=JSON.parse(JSON.stringify(a));
  for(const k of ["cards","loans","rendas","fixas","metas","cats","contas","receber"]){ const ids=new Set((out[k]||[]).map(x=>x.id)); out[k]=(out[k]||[]).concat((b[k]||[]).filter(x=>!ids.has(x.id))); }
  out.limites=Object.assign({},b.limites||{},out.limites||{});
  if(b.onboarded) out.onboarded=true; if(!out.modo&&b.modo) out.modo=b.modo;
  return out;
}

async function initStore(){

  if(db){ try{ const user=await window.claude.use("user"); id=user?await user.id():null; }catch(e){id=null} }

  store.unsubs=[

    e=>{ clearTimeout(timer); })];
}

/* ============ cartão: fatura, parcelas e empréstimos ============ */
// Mês da fatura = mês do VENCIMENTO: compra no dia do fechamento ou depois vai para a fatura seguinte;
// se o cartão vence num dia menor que o do fechamento, a fatura vence no mês seguinte ao fechamento.
function faturaMes(card,data){
  let base=mkOf(data); const f=+card.fecha, v=+card.vence;
  if(f){ const dia=+String(data).slice(8,10); if(dia>=f) base=addM(base,1); if(v&&v<=f) base=addM(base,1); }
  return base;
}
function expand(){
  const out=[];
  for(const g of state.gastos){
    const tipo=g.tipo||"gasto";
    let base=mkOf(g.data);
    const card=g.conta&&cfg().cards.find(c=>c.id===g.conta);
    if(tipo==="gasto"&&card) base=faturaMes(card,g.data);
    const n=tipo==="gasto"?Math.max(1,parseInt(g.parcelas)||1):1;
    if(n===1){ out.push(Object.assign({},g,{tipo,mes:base,dia:g.data,ref:g.id})); continue; }
    const cents=Math.round((+g.valor||0)*100), each=Math.floor(cents/n), first=cents-each*(n-1);
    for(let k=0;k<n;k++){ const mes=addM(base,k);
      out.push(Object.assign({},g,{tipo,valor:(k===0?first:each)/100,total:g.valor,mes,dia:k===0?g.data:(mes+"-01"),parcela:k+1,de:n,ref:g.id})); }
  }
  return out;
}
let ITENS=[];
const doMes=key=>ITENS.filter(i=>i.mes===key);
const gastosDe=key=>doMes(key).filter(i=>i.tipo==="gasto");
const entradasDe=key=>doMes(key).filter(i=>i.tipo==="entrada");
const guardadosDe=key=>doMes(key).filter(i=>i.tipo==="guardado");
// para as telas por dia/semana vale o dia da compra, não o mês da fatura
const noDiaDoMes=key=>ITENS.filter(i=>String(i.dia).slice(0,7)===key&&!(i.parcela>1));
// parcelas que faltam = cadastradas − pagamentos lançados depois do cadastro (vale para botão, voz e edição)

const restantesDe=l=>Math.max(0,(+l.restantes||0)-pagosLoan(l));

/* ============ finanças: contas a pagar, a receber, saldo e previsão ============ */
const FREQ={mensal:"Todo mês",unica:"Uma vez",parcelada:"Parcelada",anual:"Todo ano"};
const TIPO_CONTA={corrente:"Conta corrente",poupanca:"Poupança",dinheiro:"Dinheiro",outro:"Outra"};
const LEGADO_MES="2026-11";                              // contas e rendas criadas antes desta versão valem a partir daqui
const ultimoDia=(y,m)=>new Date(y,m,0).getDate();        // m de 1 a 12
const venceEm=(key,dia)=>{ const [y,m]=key.split("-").map(Number); return y+"-"+pad(m)+"-"+pad(Math.min(Math.max(1,+dia||1),ultimoDia(y,m))); };
const mesesEntre=(a,b)=>{ const [ya,ma]=a.split("-").map(Number), [yb,mb]=b.split("-").map(Number); return (yb-ya)*12+(mb-ma); };
const mesHoje=()=>mkOf(hojeISO());
const inicioControle=()=>cfg().v3desde||hojeISO();
const ehCartao=g=>!!(g.conta&&cfg().cards.some(c=>c.id===g.conta));

// ---------- contas a pagar ----------
// ocorrência de uma conta (mensal, única, parcelada ou anual) num mês, ou null
function ocorrencia(f,key){
  const freq=f.freq||"mensal", v=+f.valor||0;
  if(freq==="mensal"){ const desde=f.desde?mkOf(f.desde):LEGADO_MES; if(key<desde) return null; const venc=venceEm(key,f.dia||28);
    if(f.desde&&f.desde.length>7&&venc<f.desde) return null;   // cadastrada depois do vencimento deste mês
    return {venc,valor:v}; }
  if(!f.data) return null;
  const k0=mkOf(f.data), dia=+String(f.data).slice(8,10);
  if(freq==="unica") return k0===key?{venc:f.data,valor:v}:null;
  if(freq==="anual") return key>=k0&&key.slice(5,7)===k0.slice(5,7)?{venc:venceEm(key,dia),valor:v}:null;
  if(freq==="parcelada"){ const n=mesesEntre(k0,key)+1, de=Math.max(1,+f.parcelas||1); return n>=1&&n<=de?{venc:venceEm(key,dia),valor:v,n,de}:null; }
  return null;
}
// em que mês um pagamento conta: o mês da conta que ele quitou (ou, para lançamentos antigos, o mês da data)
const mesQuitado=g=>g.fixaMes||mkOf(g.data);
const pagamentosConta=(f,key)=>state.gastos.filter(g=>(g.tipo||"gasto")==="gasto"&&g.fixa===f.id&&mesQuitado(g)===key);
function faturaInfo(c,key){
  const total=sum(ITENS.filter(i=>i.tipo==="gasto"&&i.conta===c.id&&i.mes===key));
  const pagos=state.gastos.filter(g=>g.tipo==="fatura"&&g.card===c.id&&g.fatMes===key);
  return {total:r2(total),pago:r2(sum(pagos)),venc:venceEm(key,+c.vence||28),pagos};
}
const pagamentosLoan=(l,key)=>state.gastos.filter(g=>(g.tipo||"gasto")==="gasto"&&g.conta===l.id&&mesQuitado(g)===key);
// tudo o que vence num mês: contas, faturas e parcelas de empréstimo, com quanto já foi pago
function aPagarDoMes(key){
  const C=cfg(), out=[], cur=mesHoje();
  for(const f of C.fixas){ const o=ocorrencia(f,key); if(!o) continue; const pg=pagamentosConta(f,key);
    out.push({tipo:"conta",id:f.id,nome:f.name+(o.de?` (${o.n}/${o.de})`:""),venc:o.venc,valor:o.valor,pago:r2(sum(pg)),quitado:pg.length>0,pagamento:pg[0],ref:f,mes:key,cat:f.cat,semDia:(f.freq||"mensal")==="mensal"&&!f.dia}); }
  for(const c of C.cards){ const fi=faturaInfo(c,key); if(fi.total<=0&&fi.pago<=0) continue;
    out.push({tipo:"fatura",id:c.id,nome:"Fatura "+c.name,venc:fi.venc,valor:fi.total,pago:fi.pago,quitado:fi.total>0?fi.pago>=fi.total-0.005:true,ref:c,mes:key}); }
  for(const l of C.loans){ const pg=pagamentosLoan(l,key), rest=restantesDe(l);
    let existe=pg.length>0;
    if(!existe&&key>=cur){ const pagoAgora=pagamentosLoan(l,cur).length>0, k=mesesEntre(cur,key); existe=k===0?rest>0:(rest-(pagoAgora?0:1))>=k; }
    if(!existe) continue;
    out.push({tipo:"loan",id:l.id,nome:"Parcela "+l.name,venc:venceEm(key,l.dia||28),valor:+l.parcela||0,pago:r2(sum(pg)),quitado:pg.length>0,pagamento:pg[0],ref:l,mes:key,semDia:!l.dia}); }
  const ini=inicioControle();
  for(const x of out) if(!x.quitado&&!(x.pago>0)&&x.venc<ini){ x.quitado=true; x.antigo=true; }
  return out.sort((a,b)=>a.venc.localeCompare(b.venc));
}
const faltaPagar=x=>x.quitado?0:Math.max(0,r2(x.valor-x.pago));
// contas de meses anteriores que ficaram sem pagar (até 6 meses para trás)
function atrasadas(){
  const hoje=hojeISO(), out=[];
  for(let k=1;k<=6;k++){ const key=addM(mesHoje(),-k); for(const x of aPagarDoMes(key)) if(!x.quitado&&x.tipo!=="loan"&&!x.semDia&&x.venc<hoje&&faltaPagar(x)>0) out.push(x); }
  return out.sort((a,b)=>a.venc.localeCompare(b.venc));
}
// "contas que faltam" para a sobra do mês: contas e empréstimos (as compras no cartão já estão nos gastos)
function pendentesDe(key){ return aPagarDoMes(key).filter(x=>x.tipo!=="fatura"&&!x.quitado).map(x=>({nome:x.nome,valor:x.valor,tipo:x.tipo,id:x.id})); }

// ---------- a receber ----------
const recebimentosRenda=(r,key)=>state.gastos.filter(g=>g.tipo==="entrada"&&g.renda===r.id&&(g.rendaMes||mkOf(g.data))===key);
const recebimentosDe=x=>state.gastos.filter(g=>g.tipo==="entrada"&&g.receber===x.id);
function aReceberDoMes(key){
  const C=cfg(), out=[];
  for(const r of C.rendas){ const desde=r.desde?mkOf(r.desde):"0000-00"; if(key<desde) continue; const rec=recebimentosRenda(r,key);
    if(r.desde&&r.desde.length>7&&r.dia&&venceEm(key,r.dia)<r.desde&&!rec.length) continue;   // cadastrada depois do dia em que caiu
    out.push({tipo:"renda",id:r.id,nome:r.name,venc:venceEm(key,r.dia||1),valor:+r.valor||0,recebido:r2(sum(rec)),quitado:rec.length>0,recebimento:rec[0],ref:r,mes:key,semDia:!r.dia}); }
  for(const x of C.receber){ if(!x.data||mkOf(x.data)!==key) continue; const rec=recebimentosDe(x);
    out.push({tipo:"receber",id:x.id,nome:x.nome,venc:x.data,valor:+x.valor||0,recebido:r2(sum(rec)),quitado:rec.length>0,recebimento:rec[0],ref:x,mes:key}); }
  return out.sort((a,b)=>a.venc.localeCompare(b.venc));
}
const faltaReceber=x=>x.quitado?0:Math.max(0,r2(x.valor-x.recebido));
// ganhos do mês: o que já entrou + rendas fixas que ainda vão cair
function ganhoDe(key){
  const extra=sum(entradasDe(key));
  const temDados=ITENS.some(i=>i.mes===key)||key===mesHoje();
  const fixo=temDados?sum(aReceberDoMes(key).filter(x=>x.tipo==="renda"&&!x.quitado)):0;
  return {fixo,extra};
}

// ---------- saldo das contas ----------
const contaPadrao=()=>{ const C=cfg(); return C.contas.find(a=>a.id===C.contaPadrao)||C.contas[0]||null; };
const contaDe=(g,campo)=>{ const id=g[campo]; if(id&&cfg().contas.some(a=>a.id===id)) return id; const p=contaPadrao(); return p?p.id:null; };
// saldo = valor informado na data do ajuste + o que entrou − o que saiu depois disso (só o que já aconteceu)
function saldoConta(a){
  const hoje=hojeISO(), d0=a.desde||"0000-00-00", ts=+a.ts||0; let s=+a.saldo||0;
  for(const g of state.gastos){
    if(g.data>hoje||g.data<d0||(+g.criado||0)<ts) continue;
    const t=g.tipo||"gasto", v=+g.valor||0;
    if(t==="entrada"&&contaDe(g,"destino")===a.id) s+=v;
    else if(t==="gasto"&&!ehCartao(g)&&contaDe(g,"origem")===a.id) s-=v;
    else if(t==="fatura"&&contaDe(g,"origem")===a.id) s-=v;
    else if(t==="transferencia"){ if(g.de===a.id) s-=v; if(g.para===a.id) s+=v; }
  }
  return r2(s);
}
const saldoTotal=()=>r2(sum(cfg().contas,saldoConta));
const reservadoMetas=()=>r2(sum(cfg().metas,m=>guardadoMeta(m)));

// ---------- previsão ----------
// média dos gastos do dia a dia (sem contas fixas nem empréstimos) nos últimos 3 meses completos que têm lançamentos
function mediaDiaADia(){
  const ms=[]; for(let k=1;k<=6&&ms.length<3;k++){ const key=addM(mesHoje(),-k); const g=gastosDe(key).filter(i=>!i.fixa&&!cfg().loans.some(l=>l.id===i.conta)&&!(i.parcela>1)); if(g.length) ms.push(sum(g)); }
  return ms.length?r2(ms.reduce((a,b)=>a+b,0)/ms.length):0;
}
function previsaoMes(key){
  const pagar=aPagarDoMes(key), receber=aReceberDoMes(key);
  return {entra:r2(sum(receber,faltaReceber)),sai:r2(sum(pagar,faltaPagar)),pagar,receber};
}
// fim do mês atual: saldo de hoje + o que ainda entra − o que ainda vence (inclui atrasadas) − dia a dia que falta
function fimDoMes(){
  const key=mesHoje(), p=previsaoMes(key), atr=atrasadas();
  const hoje=new Date(), dim=ultimoDia(hoje.getFullYear(),hoje.getMonth()+1);
  const media=mediaDiaADia(), jaVar=sum(gastosDe(key).filter(i=>!i.fixa&&!cfg().loans.some(l=>l.id===i.conta)&&!(i.parcela>1)));
  const restoDia=media?Math.max(0,r2(media-jaVar)):0;
  const base=cfg().contas.length?saldoTotal():null;
  const sai=r2(p.sai+sum(atr,faltaPagar));
  return {base,entra:p.entra,sai,restoDia,atrasado:r2(sum(atr,faltaPagar)),fim:base==null?null:r2(base+p.entra-sai-restoDia)};
}
function proximosMeses(n){
  const out=[], f=fimDoMes(), media=mediaDiaADia(); let acum=f.fim;
  for(let k=1;k<=n;k++){ const key=addM(mesHoje(),k), p=previsaoMes(key), sobra=r2(p.entra-p.sai-media);
    if(acum!=null) acum=r2(acum+sobra); out.push({key,entra:p.entra,sai:p.sai,media,sobra,saldo:acum}); }
  return out;
}
// sobra acumulada desde o primeiro mês com lançamentos (para quem não cadastrou saldo)
function sobraAcumulada(){
  const ks=[...new Set(ITENS.map(i=>i.mes))].filter(k=>k<=mesHoje()).sort(); if(!ks.length) return null;
  let s=0; for(let k=ks[0];k<=mesHoje();k=addM(k,1)){ const g=ganhoDe(k); s+=g.fixo+g.extra-sum(gastosDe(k))-sum(guardadosDe(k)); }
  return {desde:ks[0],valor:r2(s)};
}

/* ============ interpretar frase ============ */
// Trabalha com duas versões da frase do mesmo tamanho: "n" (minúscula, sem acento) para entender,
// e "o" (como a pessoa falou) para recortar descrições com acento.
const NW={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100,cento:100,duzentos:200,duzentas:200,trezentos:300,quatrocentos:400,quinhentos:500,seiscentos:600,setecentos:700,oitocentos:800,novecentos:900};
const MESES_N=["janeiro","fevereiro","marco","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const SEMANA_N=["domingo","segunda","terca","quarta","quinta","sexta","sabado"];
function brNum(s){
  s=String(s||"").replace(/\s/g,""); if(!s) return NaN;
  if(s.includes(",")) return parseFloat(s.replace(/\./g,"").replace(",","."));
  const parts=s.split(".");
  if(parts.length===2 && parts[1].length===2) return parseFloat(s);
  return parseFloat(s.replace(/\./g,""));
}
function prep(frase){ const o=String(frase||""); const n=norm(o); return {n,o:n.length===o.length?o:n}; }

      return `<div class="multi-row" data-i="${i}">${chip}<input class="mValor" inputmode="decimal" aria-label="Valor" value="${brlIn(p.valor)}"><input class="mDesc" aria-label="Descrição" value="${esc(p.desc)}">${extra}${sub}${tb}</div>`;
    }).join("")}
    <div class="fields"><label class="field"><span class="label">Data</span><input id="mData" type="date" value="${esc(itens[0].data)}"></label></div>
    <div class="row-actions"><button class="btn primary" id="mOk">Salvar tudo</button><button class="btn ghost" id="mNo">Cancelar</button></div>
  </div>`;
  box.hidden=false;

      else { const cat=row.querySelector(".mCat").value; const g=Object.assign(base,{valor:r2(v),cat,desc:desc||catOf(cat).nome,conta:p.conta||null,forma:p.forma||"pix"});
        if(p.parcelas>1) g.parcelas=p.parcelas; if(p.fixa){ g.fixa=p.fixa; g.fixaMes=p.fixaMes||mkOf(data); } if(p.origem&&g.forma!=="cartao") g.origem=p.origem; const tb=row.querySelector(".mTrab"); if(tb) g.trabalho=tb.checked; novos.push(g); }
    }

    closeSheet();
    const [y,m]=data.split("-").map(Number); ym={y,m:m-1}; render();
    const ga=sum(novos.filter(g=>g.tipo==="entrada")), gt=sum(novos.filter(g=>!g.tipo&&isTrab(g)));
    const al=novos.map(alertaLimite).find(Boolean);
    toast(al||(ga?`Lucro do lançamento: R$ ${brl(ga-gt)}`:`${novos.length} lançamentos salvos`));
  };
}
function nomeConta(id,forma){ const C=cfg(); const c=C.cards.find(x=>x.id===id), l=C.loans.find(x=>x.id===id); return c?"Cartão "+c.name:l?l.name:(FORMAS[forma]||"Pix"); }
function alertaLimite(g){
  if(!g||g.tipo&&g.tipo!=="gasto") return null; const lim=+cfg().limites[g.cat]; if(!lim) return null;
  ITENS=expand(); const it=ITENS.find(i=>i.ref===g.id); const key=it?it.mes:mkOf(g.data);
  const tot=sum(gastosDe(key).filter(i=>i.cat===g.cat)); const pct=tot/lim*100;
  if(pct>=100) return `${catOf(g.cat).nome}: passou o limite de R$ ${brl0(lim)} (R$ ${brl(tot)})`;
  if(pct>=80) return `${catOf(g.cat).nome}: já usou ${Math.round(pct)}% do limite`;
  return null;
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, listening=false;
const HINT0="Fale ou digite. Pode juntar várias coisas numa frase só.";
function openSheet(ph){ const s=$("#sheet"); s.hidden=false; document.body.classList.add("sheet-open"); $("#sheetTitle").textContent="Novo lançamento"; $("#sayArea").hidden=false; if(ph) $("#sayInput").placeholder=ph; }
function closeSheet(){ if(listening&&rec){try{rec.stop()}catch(_){}} $("#sheet").hidden=true; document.body.classList.remove("sheet-open"); closeConfirm(); $("#sayInput").value=""; const h=$("#hint"); h.classList.remove("alert"); h.textContent=HINT0; }
function editar(id){ const g=state.gastos.find(x=>x.id===id); if(!g) return; openSheet(); showEditor(Object.assign({tipo:g.tipo||"gasto",avisos:[]},g),{editId:id}); }
function micFallback(){ const h=$("#hint"); h.classList.add("alert"); h.textContent="Toque no microfone do teclado do celular para falar."; $("#sayInput").focus(); }
function ouvir(){
  if(listening&&rec){rec.stop();return}
  if(!SR){ micFallback(); return; }
  try{
    rec=new SR(); rec.lang="pt-BR"; rec.interimResults=true; rec.maxAlternatives=1;
    rec.onstart=()=>{listening=true;$("#sheetMic").classList.add("on");$("#hint").classList.remove("alert");$("#hint").textContent="Ouvindo…"};
    rec.onresult=e=>{ let txt=""; for(const r of e.results) txt+=r[0].transcript; $("#sayInput").value=txt; if(e.results[e.results.length-1].isFinal){ showItens(interpretar(txt)); } };
    rec.onerror=e=>{ listening=false; $("#sheetMic").classList.remove("on"); if(e.error==="no-speech"){$("#hint").textContent="Não ouvi nada. Toque e fale de novo.";} else micFallback(); };
    rec.onend=()=>{ listening=false; $("#sheetMic").classList.remove("on"); if(!$("#hint").classList.contains("alert")) $("#hint").textContent=HINT0; };
    rec.start();

// Meta diária: quanto ainda precisa ganhar por dia de trabalho para pagar o mês (gastos lançados + contas que faltam − renda fixa).
function metaDiaria(key){
  const hojeD=new Date(); if(key!==mkOf(hojeISO())) return null;
  if(!ehDiario()&&!entradasDe(key).some(i=>!i.renda&&!i.receber)) return null;
  const C=cfg(), hj=hojeISO(), {fixo}=ganhoDe(key);
  const custo=sum(gastosDe(key))+sum(pendentesDe(key))+sum(guardadosDe(key));
  const antes=sum(entradasDe(key).filter(i=>i.dia<hj)), feitoHoje=sum(entradasDe(key).filter(i=>i.dia===hj));

  const dim=new Date(hojeD.getFullYear(),hojeD.getMonth()+1,0).getDate(), restam=dim-hojeD.getDate()+1;

  return {hoje:falta/dias,falta,dias,feitoHoje};
}

function chart6(key){
  const ms=[]; for(let k=5;k>=0;k--) ms.push(addM(key,-k));
  const data=ms.map(m=>{ const g=ganhoDe(m); return {m,ganho:g.fixo+g.extra,gasto:sum(gastosDe(m))}; });
  if(!data.some(d=>d.ganho||d.gasto)) return `<div class="empty">O gráfico aparece quando houver lançamentos.</div>`;
  const W=340,H=170,L=36,R=6,T=14,B=26, max=Math.max(...data.map(d=>Math.max(d.ganho,d.gasto)))||1;
  const step=Math.pow(10,Math.floor(Math.log10(max))); const nice=Math.ceil(max/step)*step; const ticks=[0,nice/2,nice];
  const y=v=>T+(H-T-B)*(1-v/nice), cw=(W-L-R)/6, bw=Math.min(16,cw*0.32);
  const kfmt=v=>v>=1000?(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+"k":brl0(v);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ganhos e gastos dos últimos 6 meses">`;
  ticks.forEach(t=>{ s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${kfmt(t)}</text>`; });
  data.forEach((d,i)=>{ const cx=L+cw*i+cw/2, cur=d.m===key;
    if(d.ganho) s+=`<rect x="${cx-bw-1}" y="${y(d.ganho)}" width="${bw}" height="${y(0)-y(d.ganho)}" rx="3" fill="var(--accent)" opacity="${cur?1:.55}"><title>Ganhos R$ ${brl(d.ganho)}</title></rect>`;

    ${media!=null?`<p class="hint">Sobra média: <b class="${media<0?"neg":"pos"}">R$ ${brl(media)}</b> por mês.</p>`:""}</div>`;
}

/* ---------- Por dia: dias, semanas, plataformas ---------- */
const PLATS=[["99food","99Food"],["99 food","99Food"],["uber eats","Uber Eats"],["uber","Uber"],["99","99"],["ifood","iFood"],["rappi","Rappi"],["loggi","Loggi"],["lalamove","Lalamove"],["indrive","inDrive"],["cabify","Cabify"],["shopee","Shopee"],["mercado livre","Mercado Livre"],["amazon","Amazon"],["ze delivery","Zé Delivery"],["gorjeta","Gorjetas"],["particular","Corridas particulares"]];
function plataformaDe(desc){ const n=norm(desc); for(const [k,l] of PLATS) if(hasWord(n,k)) return l; if(/salario/.test(n)) return null; return cap(String(desc||"").trim())||"Outros ganhos"; }
function agregaDias(itens){
  const dias={};
  for(const g of itens){ const d=dias[g.dia]||(dias[g.dia]={ganho:0,trab:0,casa:0,horas:0,km:0,comb:0,plats:{}});
    if(g.tipo==="entrada"){ d.ganho+=g.valor; const pl=plataformaDe(g.desc); if(pl) d.plats[pl]=(d.plats[pl]||0)+g.valor; }
    else if(g.tipo==="gasto"){ if(isTrab(g)){ d.trab+=g.valor; if(g.cat==="transporte") d.comb+=g.valor; } else d.casa+=g.valor; }
    else if(g.tipo==="jornada"){ d.horas+=+g.horas||0; d.km+=+g.km||0; } }
  return dias;
}
const inicioSemana=iso=>{ const d=dOf(iso); const dow=(d.getDay()+6)%7; return addD(iso,-dow); }; // segunda-feira
function totaisPeriodo(dias,de,ate){ const t={ganho:0,trab:0,casa:0,horas:0,km:0,diasT:0}; for(const k in dias){ if(k<de||k>ate) continue; const d=dias[k]; t.ganho+=d.ganho;t.trab+=d.trab;t.casa+=d.casa;t.horas+=d.horas;t.km+=d.km; if(d.ganho>0) t.diasT++; } return t; }

      <p class="hint">Ganhou R$ ${brl(sem.ganho)} em ${sem.diasT} dia${sem.diasT===1?"":"s"} · gastos do trabalho R$ ${brl(sem.trab)}${sem.horas?` · ${numIn(sem.horas)}h · R$ ${brl(ls/sem.horas)}/h`:""}</p></div>`;

      <div class="split" aria-hidden="true"><i style="width:${d.ganho/tot*100}%;background:var(--accent)"></i><i style="width:${d.trab/tot*100}%;background:var(--c-transp)"></i><i style="width:${d.casa/tot*100}%;background:var(--c-alim)"></i></div>
      <span class="s">${d.ganho?`Ganhou R$ ${brl(d.ganho)} · trabalho R$ ${brl(d.trab)} · lucro`:(d.trab+d.casa)?"Só gastos":"Só jornada registrada"}${d.casa?` · casa R$ ${brl(d.casa)}`:""}${extra||""}</span></div>`; };
  const jorn=d=>(d.horas||d.km)?` · ${d.horas?numIn(d.horas)+"h":""}${d.horas&&d.km?" · ":""}${d.km?brl0(d.km)+" km":""}${d.horas&&d.ganho?` · R$ ${brl((d.ganho-d.trab)/d.horas)}/h`:""}`:"";
  if(ui.diaModo==="semanas"){
    const ws={}; for(const k of keys){ const w=inicioSemana(k); const x=ws[w]||(ws[w]={ganho:0,trab:0,casa:0,horas:0,km:0}); const d=dias[k]; x.ganho+=d.ganho;x.trab+=d.trab;x.casa+=d.casa;x.horas+=d.horas;x.km+=d.km; }

  sel.value=v; if(sel.value!==v){ ui.fTipo=""; sel.value=""; }
}
function filtra(i){
  const f=ui.fTipo;
  if(f==="t:gasto"&&i.tipo!=="gasto") return false;
  if(f==="t:trabalho"&&!(i.tipo==="gasto"&&isTrab(i))) return false;
  if(f&&f.startsWith("t:")&&!["t:gasto","t:trabalho"].includes(f)&&i.tipo!==f.slice(2)) return false;
  if(f.startsWith("c:")&&!(i.tipo==="gasto"&&i.cat===f.slice(2))) return false;
  if(f.startsWith("k:")&&i.conta!==f.slice(2)) return false;
  const q=norm(ui.q).trim(); if(!q) return true;
  const meta=i.tipo==="guardado"?((cfg().metas.find(m=>m.id===i.meta)||{}).name||""):i.tipo==="transferencia"?nomeContaBanc(i.de)+" "+nomeContaBanc(i.para):"";
  const txt=norm([i.desc,i.tipo==="gasto"?catOf(i.cat).nome:"",i.tipo==="gasto"?nomeConta(i.conta,i.forma):"",meta,i.tipo==="entrada"?"ganho entrada":"",brl(i.total||i.valor)].join(" "));
  return q.split(/\s+/).every(w=>txt.includes(w));
}

/* ============ importar extrato (OFX ou CSV do banco) ============ */
// Lê o arquivo, monta uma prévia com categoria sugerida e só lança o que a pessoa confirmar.
function dataBR(s){
  s=String(s||"").trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){ const y=m[3].length===2?"20"+m[3]:m[3]; return `${y}-${pad(m[2])}-${pad(m[1])}`; }
  if((m=s.match(/^(\d{4})(\d{2})(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function valorBR(s){
  s=String(s||"").trim().replace(/\s|R\$/g,""); if(!s) return NaN;
  const neg=/^-|^\(.*\)$|-$/.test(s); s=s.replace(/[()\-+]/g,"");
  let v; if(/,\d{1,2}$/.test(s)) v=parseFloat(s.replace(/\./g,"").replace(",",".")); else v=parseFloat(s.replace(/,/g,""));
  return neg?-v:v;
}
function parseOFX(txt){
  const out=[]; const blocos=txt.split(/<STMTTRN>/i).slice(1);
  const tag=(b,t)=>{ const m=b.match(new RegExp("<"+t+">([^<\\r\\n]*)","i")); return m?m[1].trim():""; };
  for(const b of blocos){ const data=dataBR(tag(b,"DTPOSTED")), v=valorBR(tag(b,"TRNAMT").replace(",",".")), desc=tag(b,"MEMO")||tag(b,"NAME")||"Lançamento";
    if(data&&!isNaN(v)&&v!==0) out.push({data,valor:v,desc,fitid:tag(b,"FITID")}); }
  return out;
}
function linhasCSV(txt){
  const sep=(txt.split("\n")[0].match(/;/g)||[]).length>=(txt.split("\n")[0].match(/,/g)||[]).length?";":",";
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<txt.length;i++){ const ch=txt[i];
    if(q){ if(ch==='"'&&txt[i+1]==='"'){ cur+='"'; i++; } else if(ch==='"') q=false; else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===sep){ row.push(cur); cur=""; } else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; } else if(ch!=="\r") cur+=ch; }
  if(cur||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()));
}
function parseCSV(txt){
  const rows=linhasCSV(txt.replace(/^﻿/,"")); if(rows.length<2) return [];
  // acha a linha de cabeçalho e as colunas de data, descrição e valor (ou entrada/saída)
  let hi=rows.findIndex(r=>r.some(c=>/^\s*data/i.test(norm(c))||/^\s*date\s*$/i.test(c))); if(hi<0) hi=0;
  const H=rows[hi].map(c=>norm(c).trim());
  const col=re=>H.findIndex(h=>re.test(h));
  const cData=col(/^data|^date|^dt/), cDesc=col(/descri|historico|memo|title|titulo|estabelecimento|lancamento|detalhe/),
        cVal=col(/^valor|^quantia|^montante|^amount|^value/), cEnt=col(/entrada|credito/), cSai=col(/saida|debito/);
  if(cData<0||(cVal<0&&cEnt<0&&cSai<0)) return null;
  const out=[];
  for(const r of rows.slice(hi+1)){
    const data=dataBR(r[cData]); if(!data) continue;
    let v; if(cVal>=0) v=valorBR(r[cVal]); else { const e=cEnt>=0?valorBR(r[cEnt]):NaN, s=cSai>=0?valorBR(r[cSai]):NaN; v=(!isNaN(e)&&e?Math.abs(e):0)-(!isNaN(s)&&s?Math.abs(s):0); }
    if(isNaN(v)||!v) continue;
    out.push({data,valor:v,desc:(cDesc>=0?r[cDesc]:"").trim()||"Lançamento"});
  }
  return out;
}
function categoriaDe(desc){ const t=norm(desc); let best=null;
  for(const c of CATS) for(const k of (c.kw||[])){ const f=findWord(t,k); if(f&&(!best||k.length>best.len)) best={c:c.id,len:k.length}; }
  return best?best.c:"outros"; }
const chaveImp=x=>x.data+"|"+r2(Math.abs(x.valor))+"|"+norm(x.desc).replace(/[^a-z0-9]/g,"").slice(0,18);
function jaExiste(x){ const k=chaveImp(x); return state.gastos.some(g=>g.imp===k||(g.data===x.data&&Math.abs((+g.valor||0)-Math.abs(x.valor))<0.005&&norm(g.desc).slice(0,10)===norm(x.desc).slice(0,10))); }
function lerExtrato(file){
  const processa=txt=>{
    const ofx=/<OFX>|<STMTTRN>/i.test(txt), lista=ofx?parseOFX(txt):parseCSV(txt);
    if(!lista||!lista.length){ toast(lista===null?"Não achei as colunas de data e valor nesse arquivo.":"Nenhum lançamento encontrado no arquivo."); return; }
    // fatura de cartão costuma vir com compras positivas; extrato de conta, com saídas negativas
    const pos=lista.filter(x=>x.valor>0).length, cartaoProvavel=!ofx&&pos>lista.length*0.6&&cfg().cards.length>0;
    const rows=lista.map((x,i)=>{ const dup=jaExiste(x); return {i,data:x.data,valor:x.valor,desc:x.desc.slice(0,80),cat:categoriaDe(x.desc),dup,on:!dup&&!(cartaoProvavel&&x.valor<0)}; });
    ui.imp={nome:file.name,rows,destino:cartaoProvavel?"card":"conta",card:(cfg().cards[0]||{}).id,conta:(contaPadrao()||{}).id};
    tab="ajustes"; render(); const el=$("#impBox"); if(el) el.scrollIntoView({block:"start"});
  };
  const fr=new FileReader();
  fr.onload=()=>{ const txt=String(fr.result||"");
    // extratos antigos vêm em Latin-1: se aparecer caractere inválido, relê nessa codificação (uma vez só)
    if(txt.includes("\ufffd")){ const f2=new FileReader(); f2.onload=()=>processa(String(f2.result||"")); f2.onerror=()=>processa(txt); f2.readAsText(file,"ISO-8859-1"); return; }
    processa(txt); };
  fr.onerror=()=>toast("Não deu para abrir o arquivo.");
  fr.readAsText(file);
}
function importarHTML(){
  const C=cfg(), I=ui.imp;
  let h=`<div class="sec">Importar extrato do banco</div><div class="set" id="impBox">
    <p class="hint">Baixe o extrato no app ou site do seu banco, em OFX ou CSV (planilha), e escolha o arquivo aqui. Você confere tudo antes de importar. O que já foi lançado aparece desmarcado.</p>`;
  if(!I){ return h+`<div class="row-actions"><button class="btn small primary" id="pickImport">Escolher arquivo</button></div></div>`; }

      <span class="t"><b>${esc(r.desc)}</b><small>${ddmm(r.data)}/${r.data.slice(0,4)}${r.dup?" · já lançado":""}${ignora?" · pagamento/estorno, não entra":""}</small></span>
      <span class="num ${sai?"":"pos"}">${sai?"−":"+"}R$ ${brl(Math.abs(r.valor))}</span>
      ${sai?`<select data-impcat="${r.i}" aria-label="Categoria">${catOptions(r.cat)}</select>`:`<span class="hint">ganho</span>`}</div>`; };
  h+=`<b>${esc(I.nome)}</b>
    <div class="fields imp-fields">
      <label class="field"><span class="label">Esse arquivo é</span><select id="impDestino"><option value="conta" ${!card?"selected":""}>Extrato da conta</option>${C.cards.length?`<option value="card" ${card?"selected":""}>Fatura do cartão de crédito</option>`:""}</select></label>
      ${card?`<label class="field"><span class="label">Cartão</span><select id="impCard">${C.cards.map(c=>`<option value="${esc(c.id)}" ${c.id===I.card?"selected":""}>${esc(c.name)}</option>`).join("")}</select></label>`
        :C.contas.length?`<label class="field"><span class="label">Conta</span><select id="impConta">${contaBancOptions(I.conta)}</select></label>`:""}
    </div>
    <div class="imp-list">${I.rows.map(lin).join("")}</div>
    <div class="row-actions"><button class="btn primary" data-imp="ok">Importar ${sel.length} lançamento${sel.length===1?"":"s"}</button><button class="btn ghost" data-imp="todos">${sel.length===I.rows.length?"Desmarcar todos":"Marcar todos"}</button><button class="btn ghost" data-imp="cancelar">Cancelar</button></div>
    <p class="hint">Transferências entre suas próprias contas e pagamento de fatura aparecem no extrato: desmarque para não contar como gasto.</p></div>`;
  return h;

async function acaoImport(btn,acao){
  const I=ui.imp; if(!I) return;
  if(acao==="cancelar"){ ui.imp=null; render(); return; }
  if(acao==="todos"){ const todos=I.rows.every(r=>r.on); I.rows.forEach(r=>{ r.on=!todos&&!(I.destino==="card"&&r.valor<0); }); render(); return; }
  if(acao!=="ok") return;
  const card=I.destino==="card", sel=I.rows.filter(r=>r.on&&!(card&&r.valor<0));
  if(!sel.length){ toast("Marque pelo menos um lançamento"); return; }
  btn.disabled=true; let n=0; const agora=Date.now();
  for(const r of sel){
    const base={id:uid(),data:r.data,criado:agora+n,imp:chaveImp(r),texto:"Importado de "+I.nome};
    let g;
    if(card) g=Object.assign(base,{valor:r2(Math.abs(r.valor)),cat:r.cat,desc:cap(r.desc),conta:I.card,forma:"cartao"});
    else if(r.valor<0) g=Object.assign(base,{valor:r2(-r.valor),cat:r.cat,desc:cap(r.desc),conta:null,forma:"debito",origem:I.conta||undefined});
    else g=Object.assign(base,{tipo:"entrada",valor:r2(r.valor),cat:"entrada",desc:cap(r.desc),conta:null,forma:"entrada",destino:I.conta||undefined});
    if(g.origem===undefined) delete g.origem; if(g.destino===undefined) delete g.destino;
    // lançamentos de antes do último ajuste de saldo não mexem no saldo (o banco já contou)
    await store.saveGasto(g); n++; if(n%10===0) toast(`Importando… ${n} de ${sel.length}`);
  }
  ui.imp=null; render(); toast(`${n} lançamento${n===1?"":"s"} importado${n===1?"":"s"}`);
}

const PINK="caderneta-pin";
const pinGet=()=>{ try{ return JSON.parse(localStorage.getItem(PINK)||"null"); }catch(_){ return null; } };
async function pinHash(pin,salt){
  try{ if(crypto&&crypto.subtle){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pin)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); } }catch(_){}
  let h=7; for(const ch of salt+":"+pin) h=(h*31+ch.charCodeAt(0))|0; return "f"+h;
}
async function pinSet(pin){ const salt=uid()+uid(); localStorage.setItem(PINK,JSON.stringify({s:salt,h:await pinHash(pin,salt),n:pin.length})); }

  $("#lock").innerHTML=`<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <h2>Digite seu PIN</h2><div class="dots" aria-label="${typed.length} de ${n} números">${Array.from({length:n},(_,i)=>`<i class="${i<typed.length?"on":""}"></i>`).join("")}</div>
    <div class="msg" role="alert">${esc(msg||"")}</div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-k="${d}">${d}</button>`).join("")}<button class="txt" data-k="esqueci">Esqueci</button><button data-k="0">0</button><button class="txt" data-k="apagar" aria-label="Apagar">⌫</button></div>`;
}
async function teclaPin(k){
  if(Date.now()<esperaAte){ drawLock(`Aguarde ${Math.ceil((esperaAte-Date.now())/1000)} segundos.`); return; }
  const P=pinGet(); if(!P){ unlock(); return; }
  if(k==="apagar"){ typed=typed.slice(0,-1); drawLock(""); return; }
  if(k==="esqueci"){ esqueci=true; drawLock(""); return; }
  if(!/^\d$/.test(k)||typed.length>=P.n) return;
  typed+=k; drawLock("");
  if(typed.length===P.n){
    const ok=(await pinHash(typed,P.s))===P.h;
    if(ok){ unlock(); return; }
    erros++; typed="";
    if(erros>=5){ esperaAte=Date.now()+30000; erros=0; drawLock("Muitas tentativas. Aguarde 30 segundos."); }
    else drawLock("PIN errado. Tente de novo.");
  }
}
$("#lock").addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.k) return teclaPin(b.dataset.k);
  if(b.id==="lockBack"){ esqueci=false; drawLock(""); }
  if(b.id==="lockReset"){ try{ localStorage.removeItem(PINK); if(store.kind!=="db"){ localStorage.removeItem(LS); state.config={}; state.gastos=[]; } }catch(_){} unlock(); render(); toast(store.kind==="db"?"PIN desligado":"Dados deste aparelho apagados"); }
});

const NOTIF_K="caderneta-notif";
// próximas contas e faturas a vencer, guardadas onde o serviço do app consegue ler com o app fechado
function agenda(){
  const hoje=hojeISO(), out=[];
  for(const off of [0,1]){ const key=addM(mesHoje(),off);
    for(const x of aPagarDoMes(key)){ const fp=faltaPagar(x); if(fp<=0||x.semDia) continue; out.push({id:x.tipo+"-"+x.id+"-"+key,titulo:x.nome,valor:fp,vence:x.venc}); } }
  return out.filter(a=>a.vence>=hoje&&a.vence<=addD(hoje,7));
}
let agendaSig="";
function escreverAgenda(){
  if(!APP||!("caches" in window)) return; let on=false; try{on=localStorage.getItem(NOTIF_K)==="1"}catch(_){}
  if(!on) return; const a=JSON.stringify(agenda()); if(a===agendaSig) return; agendaSig=a;
  caches.open("caderneta-agenda").then(c=>c.put("agenda.json",new Response(a,{headers:{"content-type":"application/json"}}))).catch(()=>{});
}
async function ligarNotif(){
  if(!("Notification" in window)||!("serviceWorker" in navigator)){ toast("Este celular não permite notificações aqui."); return; }
  const perm=await Notification.requestPermission(); if(perm!=="granted"){ toast("Permissão de notificação negada. Libere nas configurações do Android."); return; }
  let modo="aberto";
  try{ const reg=await navigator.serviceWorker.ready;
    if(reg.periodicSync){ await reg.periodicSync.register("contas",{minInterval:12*3600*1000}); modo="auto"; }
    const prox=agenda().filter(a=>a.vence<=addD(hojeISO(),2));
    reg.showNotification("Lembretes ligados",{body:prox.length?prox.map(a=>`${a.titulo}: R$ ${brl(a.valor)} (${quando(diasAte(a.vence))})`).join("\n"):"Você vai ser avisado quando uma conta estiver perto de vencer.",icon:"icons/icon-192.png",badge:"icons/icon-192.png",tag:"caderneta-on"});
  }catch(_){}
  try{ localStorage.setItem(NOTIF_K,"1"); localStorage.setItem(NOTIF_K+"-modo",modo); }catch(_){}
  agendaSig=""; escreverAgenda(); render();
}
async function desligarNotif(){ try{ localStorage.removeItem(NOTIF_K); const reg=await navigator.serviceWorker.ready; if(reg.periodicSync) await reg.periodicSync.unregister("contas"); }catch(_){} render(); }

/* ============ cópia de segurança e planilha ============ */
async function baixar(nome,data,tipo){
  if(IN_CLAUDE){ let dl=null; try{ dl=await window.claude.use("downloads"); }catch(_){}
    if(dl){ try{ await dl.save({filename:nome,data}); return true; }catch(e){ if(e&&e.code==="declined"){ toast("Download cancelado"); return false; } } } }
  else { try{ const url=URL.createObjectURL(new Blob([data],{type:tipo})); const a=document.createElement("a"); a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); return true; }catch(_){} }
  try{ await navigator.clipboard.writeText(data.replace(/^﻿/,"")); toast("Não deu para baixar aqui, então copiei o conteúdo."); return true; }catch(_){ erroSalvar(_,"Não foi possível salvar aqui."); return false; }
}
const backupJSON=()=>JSON.stringify({app:"din",formato:1,versao:VERSAO_APP,exportado:new Date().toISOString(),config:cfg(),gastos:state.gastos});
const backupNome=()=>`din-copia-${hojeISO()}.json`;
async function salvarBackup(){ if(await baixar(backupNome(),backupJSON(),"application/json")){ try{localStorage.setItem("caderneta-ultimo-backup",hojeISO())}catch(_){} toast("Cópia salva"); render(); } }
async function enviarBackup(){
  try{ const f=new File([backupJSON()],backupNome(),{type:"application/json"}); if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:"Cópia do Din"}); try{localStorage.setItem("caderneta-ultimo-backup",hojeISO())}catch(_){} render(); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  salvarBackup();
}
function lerArquivoBackup(file){
  const fr=new FileReader();
  fr.onload=()=>{ try{
      const d=JSON.parse(String(fr.result||""));
      if(!d||!["din","caderneta"].includes(d.app)||typeof d.config!=="object"||!Array.isArray(d.gastos)) throw 0;
      const gastos=d.gastos.filter(g=>g&&typeof g==="object"&&typeof g.id==="string"&&g.id&&typeof g.data==="string");
      ui.restore={config:d.config||{},gastos,quando:d.exportado?new Date(d.exportado).toLocaleDateString("pt-BR"):"data desconhecida"};
      tab="ajustes"; render();
    }catch(_){ toast("Esse arquivo não é uma cópia do Din."); } };
  fr.onerror=()=>toast("Não deu para abrir o arquivo.");
  fr.readAsText(file);
}
function csv(itens){
  const q=v=>{ v=String(v??""); return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const num=v=>(Number(v)||0).toFixed(2).replace(".",",");
  const head=["Data","Mês de referência","Tipo","Categoria","Descrição","Pago com","Parcela","Trabalho","Valor (R$)","Horas","Km"];
  const tipoN={gasto:"Gasto",entrada:"Ganho",guardado:"Guardado em meta",jornada:"Jornada",fatura:"Pagamento de fatura",transferencia:"Transferência"};
  const rows=itens.sort((a,b)=>String(a.dia).localeCompare(b.dia)).map(g=>[
    String(g.dia).split("-").reverse().join("/"), g.mes.split("-").reverse().join("/"), tipoN[g.tipo]||g.tipo,
    g.tipo==="gasto"?catOf(g.cat).nome:"", g.tipo==="guardado"?((cfg().metas.find(m=>m.id===g.meta)||{}).name||g.desc):g.desc,
    g.tipo==="gasto"?nomeConta(g.conta,g.forma):"", g.de?`${g.parcela}/${g.de}`:"", g.tipo==="gasto"&&isTrab(g)?"sim":"", g.tipo==="gasto"?"-"+num(g.valor):num(g.valor), g.horas?num(g.horas):"", g.km||""]);
  return "﻿"+[head,...rows].map(r=>r.map(q).join(";")).join("\r\n");
}
async function exportar(modo){
  const itens=modo==="mes"?doMes(curKey()):modo==="ano"?ITENS.filter(i=>String(i.mes).slice(0,4)===String(ym.y)):ITENS.slice();

  if(await baixar(modo==="mes"?`din-${curKey()}.csv`:modo==="ano"?`din-${ym.y}.csv`:"din-completo.csv",csv(itens),"text/csv;charset=utf-8")) toast("Planilha pronta");
}
