<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caderneta</title>
<meta name="description" content="Controle de gastos com lançamento por voz.">
<meta name="theme-color" content="#F5F6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0F0D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna. Barra superior com o mês, conteúdo em listas agrupadas, barra de navegação embaixo com o microfone no centro. Um só acento verde; cores das categorias só em pontos pequenos. */
:root{
  --bg:#F5F6F4; --surface:#FFFFFF; --sunk:#ECEEEA; --line:#E3E6E1;
  --fg:#101512; --muted:#6A746E; --faint:#9AA39D;
  --accent:#0D7A5B; --accent-fg:#FFFFFF; --accent-soft:#E2F1EB;
  --danger:#C23A2E; --danger-soft:#FBE7E4; --warn:#A35F00; --warn-soft:#FDF0DA;
  --c-alim:#D06A2E; --c-aluguel:#3F6BB5; --c-energia:#D2A41C; --c-agua:#2593AE; --c-net:#7A5DB0;
  --c-transp:#97764A; --c-saude:#C74A5C; --c-lazer:#DD8240; --c-educ:#4C8B47; --c-compras:#AE5498;
  --c-emprest:#6B7077; --c-outros:#9AA39D;
  --c-pets:#B5713A; --c-filhos:#3E9C8F; --c-beleza:#C2527F; --c-casa:#6F7F3A; --c-familia:#5C6FC4; --c-impostos:#8A5A44;
  --c-x1:#2F8F6F; --c-x2:#B0603A; --c-x3:#5868B8; --c-x4:#A84E8C; --c-x5:#8C8A2E; --c-x6:#3C8FB0;
  --f:"Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-display:var(--f); --f-body:var(--f); --f-num:var(--f);
  --r:18px; --r-s:12px;
  --nav-h:68px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C0F0D; --surface:#151916; --sunk:#1D221F; --line:#252B27;
  --fg:#EDF1EE; --muted:#8D9892; --faint:#5F6963;
  --accent:#46CFA2; --accent-fg:#03241A; --accent-soft:#12302A;
  --danger:#FF8B80; --danger-soft:#3A1B18; --warn:#F2B75E; --warn-soft:#33270F;
  --c-alim:#EE8A50; --c-aluguel:#7AA1E6; --c-energia:#EAC748; --c-agua:#5AC4DD; --c-net:#AD93DE;
  --c-transp:#CDA673; --c-saude:#F07D8E; --c-lazer:#F4A061; --c-educ:#82C47C; --c-compras:#DE86C7;
  --c-pets:#DD9A62; --c-filhos:#5FC7B8; --c-beleza:#EE80AB; --c-casa:#A8BA62; --c-familia:#8C9CF0; --c-impostos:#C98F74;
  --c-x1:#5AC9A1; --c-x2:#E7915F; --c-x3:#8F9CF0; --c-x4:#DE86C4; --c-x5:#CFCB5E; --c-x6:#6CC3E6;
  --c-emprest:#A8AEB5; --c-outros:#76817A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C0F0D; --surface:#151916; --sunk:#1D221F; --line:#252B27;
  --fg:#EDF1EE; --muted:#8D9892; --faint:#5F6963;
  --accent:#46CFA2; --accent-fg:#03241A; --accent-soft:#12302A;
  --danger:#FF8B80; --danger-soft:#3A1B18; --warn:#F2B75E; --warn-soft:#33270F;
  --c-alim:#EE8A50; --c-aluguel:#7AA1E6; --c-energia:#EAC748; --c-agua:#5AC4DD; --c-net:#AD93DE;
  --c-transp:#CDA673; --c-saude:#F07D8E; --c-lazer:#F4A061; --c-educ:#82C47C; --c-compras:#DE86C7;
  --c-pets:#DD9A62; --c-filhos:#5FC7B8; --c-beleza:#EE80AB; --c-casa:#A8BA62; --c-familia:#8C9CF0; --c-impostos:#C98F74;
  --c-x1:#5AC9A1; --c-x2:#E7915F; --c-x3:#8F9CF0; --c-x4:#DE86C4; --c-x5:#CFCB5E; --c-x6:#6CC3E6;
  --c-emprest:#A8AEB5; --c-outros:#76817A; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.45;margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.sheet-open{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h3{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.label{font-size:13px;color:var(--muted);font-weight:500}
.hint{font-size:13px;color:var(--muted);margin:0}
.hint.alert{color:var(--warn)}
.pos{color:var(--accent)} .neg{color:var(--danger)} .muted{color:var(--muted)}

/* barra superior */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.appbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{width:40px;height:40px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;color:var(--muted)}
.month button:hover{background:var(--sunk)}
.month strong{font-weight:600;min-width:92px;text-align:center;text-transform:capitalize;font-size:15px}
.expill{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:4px 4px 4px 10px}
.expill button{border:0;background:var(--surface);color:var(--warn);border-radius:999px;padding:3px 10px;font-weight:600;font-size:12.5px}

main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:10px}
.sec{font-size:13px;color:var(--muted);font-weight:500;margin:18px 2px 0}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 2px 0}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13.5px;padding:4px 0}

/* destaque (sobra do mês) */
.hero{background:var(--surface);border-radius:var(--r);padding:20px 18px 16px;display:grid;gap:12px}
.hero-label{font-size:14px;color:var(--muted);font-weight:500}
.hero-num{font-size:clamp(40px,12vw,54px);font-weight:700;line-height:1;letter-spacing:-.035em;margin-top:-4px}
.hero-num small{font-size:.4em;font-weight:600;color:var(--muted);margin-right:6px;letter-spacing:0;vertical-align:.55em}
.hero-num.neg small{color:var(--danger)}
.meter{position:relative;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--accent)}
.meter i.warn{background:var(--warn)} .meter i.over{background:var(--danger)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{display:grid;gap:1px;min-width:0}
.trio span{font-size:12.5px;color:var(--muted)}
.trio b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-foot{font-size:13px;color:var(--muted);padding-top:10px;border-top:1px solid var(--line)}
.hero-foot b{color:var(--fg);font-weight:600}
.hero-foot b.neg{color:var(--danger)}
.today{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 0 0;font-size:13.5px;color:var(--muted)}
.today>span:first-child{color:var(--fg);font-weight:600}
.today b{color:var(--fg);font-weight:600}
.chev{width:16px;height:16px;margin-left:auto;fill:none;stroke:var(--faint);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ask{display:grid;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.ask>span{font-weight:600}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-s);padding:12px;display:grid;gap:2px}
.choice button strong{font-weight:600}
.choice button span{font-size:12.5px;color:var(--muted)}

/* listas agrupadas */
.list,.box{background:var(--surface);border-radius:var(--r);overflow:hidden}
.box{padding:2px 16px}
.row,.alert-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:13px 16px;border:0;background:transparent;width:100%;text-align:left}
.list>*+*{border-top:1px solid var(--line)}
.row .t,.alert-row .t{min-width:0;font-weight:500}
.row small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.alert-row{grid-template-columns:auto 1fr auto}
.alert-row .num{font-weight:600;font-size:14px}
.sig{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.sig.bad{background:var(--danger)}
.icon-btn{width:40px;height:40px;border:0;border-radius:8px;background:transparent;color:var(--faint);font-size:19px;line-height:1}
.icon-btn:hover{background:var(--sunk);color:var(--danger)}

/* categorias */
.cat-row{display:grid;grid-template-columns:auto 1fr auto;gap:5px 12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.cat-row:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.cat-name{font-weight:500;min-width:0}
.cat-val{font-weight:600;font-variant-numeric:tabular-nums}
.bar{grid-column:2/4;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.bar i.warn{background:var(--warn)!important} .bar i.over{background:var(--danger)!important}
.cat-meta{grid-column:2/4;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.cmp{font-weight:500}
.cmp.up{color:var(--danger)} .cmp.down{color:var(--accent)}
.limrow{display:grid;grid-template-columns:auto 1fr 112px;gap:10px;align-items:center;font-size:14px}
.limrow input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}

/* gráfico */
.chart-wrap{background:var(--surface);border-radius:var(--r);padding:14px 14px 10px;overflow-x:auto;display:grid;gap:6px}
.chart-wrap svg{display:block;width:100%;min-width:290px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* cartões genéricos (cartão de crédito, empréstimo, meta) */
.card{border-radius:var(--r);padding:16px;background:var(--surface);display:grid;gap:10px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.fatura{display:flex;justify-content:space-between;align-items:end;gap:10px}
.fatura .num{font-size:24px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.fatura{flex-wrap:wrap}
.limit,.goalbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.limit i,.goalbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.mini{display:grid;gap:7px;font-size:13.5px}
.mini div{display:flex;justify-content:space-between;gap:10px}
.mini span:first-child{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:6px;padding:1px 5px;margin-left:4px}
.bill{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:13px 16px}
.bill b{font-weight:600;min-width:0}
.bill .num{font-weight:600}
.bill .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bill.paid{opacity:.6}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.statgrid div{background:var(--surface);border-radius:var(--r-s);padding:11px 12px;display:grid;gap:2px;min-width:0}
.statgrid .num{font-weight:600;font-size:15px}
.goal-day{display:grid;gap:10px;background:var(--surface);border-radius:var(--r);padding:18px}
.goal-day .big{font-size:34px;font-weight:700;line-height:1;letter-spacing:-.03em}
.dayrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--surface);border-radius:var(--r-s);padding:12px 14px}
.dayrow .d{font-weight:600}
.dayrow .d::first-letter,.day::first-letter{text-transform:uppercase}
.dayrow .l{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.dayrow .s{font-size:12.5px;color:var(--muted);grid-column:1/3}
.dayrow .split{grid-column:1/3;height:4px;border-radius:2px;background:var(--sunk);display:flex;overflow:hidden;gap:2px}
.dayrow .split i{display:block;height:100%;border-radius:2px}

/* botões e formulários */
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;background:var(--sunk);border-radius:var(--r-s);padding:10px 15px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;padding-inline:8px}
.btn.small{padding:7px 12px;font-size:13px}
.btn.danger{color:var(--danger)}
.add-form{display:grid;gap:12px;background:var(--surface);border-radius:var(--r);padding:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.field{display:grid;gap:5px;min-width:0}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;min-width:0}
.inline-save{display:flex;gap:8px}
.inline-save input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px}
.empty{color:var(--muted);text-align:center;padding:26px 16px;background:var(--surface);border-radius:var(--r);font-size:14px}
.empty b{color:var(--fg);font-weight:600}

/* segmentos da carteira */
.seg{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:12px;margin-top:2px}
.seg button{flex:1;border:0;background:transparent;padding:11px 6px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.panel{display:grid;gap:10px}

/* histórico */
.day{font-size:13px;color:var(--muted);font-weight:500;margin:12px 2px 0}
.tx{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:var(--surface);border-radius:var(--r-s);padding:8px 4px 8px 14px;cursor:pointer;min-height:56px}
.tx:hover{background:var(--sunk)}
.tx .t{min-width:0}
.tx .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t span{font-size:12.5px;color:var(--muted)}
.tx .num{font-weight:600}
.tx .del{border:0;background:transparent;color:var(--faint);width:40px;height:40px;border-radius:8px;font-size:18px;line-height:1}
.tx .del:hover{color:var(--danger);background:var(--sunk)}

/* navegação inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar-in{max-width:560px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center}
.tabbar [data-tab]{border:0;background:transparent;display:grid;justify-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--faint);padding:8px 0}
.tabbar [data-tab] svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar [aria-current="page"]{color:var(--fg)}
.mic{justify-self:center;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 18px rgba(13,122,91,.32),0 0 0 5px var(--bg)}
.mic svg,.sheet-mic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* painel de lançar */
.sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-bg{position:absolute;inset:0;background:rgba(8,12,10,.42);border:0}
.sheet-in{position:relative;width:100%;min-width:0;grid-template-columns:minmax(0,1fr);background:var(--surface);border-radius:22px 22px 0 0;max-height:88vh;overflow-y:auto;display:grid;gap:12px;
  padding-top:10px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet-in{animation:none}}
.sheet-inner{max-width:560px;width:100%;min-width:0;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.sheet-inner>*{min-width:0}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);justify-self:center}
.sheet-top{display:flex;justify-content:space-between;align-items:center}
.sheet-top h3{font-size:18px}
.say{display:flex;gap:8px;align-items:center}
.sheet-mic{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;position:relative}
.sheet-mic.on{background:var(--accent);color:var(--accent-fg)}
.sheet-mic.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--accent);animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{opacity:.9;transform:scale(.92)}to{opacity:0;transform:scale(1.25)}}
@media (prefers-reduced-motion: reduce){.sheet-mic.on::after{animation:none;opacity:.6}}
.say form{flex:1;display:flex;gap:8px;min-width:0}
.say input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 14px;font-size:16px}
.say .go{flex:none;border:0;background:var(--fg);color:var(--bg);border-radius:14px;padding:0 16px;font-weight:600}
.examples{min-width:0;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.examples button{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 14px;font-size:13px;color:var(--muted);white-space:nowrap}
.confirm{min-width:0;grid-template-columns:minmax(0,1fr);display:grid;gap:12px;border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--bg)}
.confirm .lead{display:grid;gap:2px}
.confirm .lead .label{font-weight:600;color:var(--fg);font-size:14px}
.multi-row{display:grid;grid-template-columns:auto 92px 1fr;gap:8px;align-items:center}
.multi-row select{grid-column:2/4}
.multi-row .sub{grid-column:2/4;font-size:12.5px;color:var(--muted)}
.multi-row input,.multi-row select{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.confirm .field input,.confirm .field select{background:var(--surface)}
.ai{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px;justify-self:start}

(function(){
"use strict";
const APP=!!window.CADERNETA_APP;                 // versão instalável (fora do Claude)
const IN_CLAUDE=!APP&&!!(window.claude&&window.claude.use);
const VERSAO_APP="2.0";

/* ============ categorias ============ */
const BASE_CATS=[
 {id:"alimentacao",nome:"Alimentação",cor:"--c-alim",kw:["supermercado","mercado","mercadinho","padaria","acougue","feira","hortifruti","restaurante","lanche","lanchonete","ifood","pizza","comida","almoco","janta","jantar","cafe","cafe da manha","delivery","hamburguer","sacolao","atacadao","assai","carrefour","marmita","acai","sorvete","refri","refrigerante","pao","quitanda"]},
 {id:"aluguel",nome:"Aluguel e condomínio",cor:"--c-aluguel",kw:["aluguel","condominio","iptu"]},
 {id:"energia",nome:"Energia",cor:"--c-energia",kw:["energia","luz","conta de luz","enel","cemig","copel","light","celpe","coelba","neoenergia","equatorial","cpfl"]},

 {id:"internet",nome:"Internet e celular",cor:"--c-net",kw:["internet","wifi","celular","telefone","claro","vivo","tim","oi","recarga","plano do celular"]},
 {id:"transporte",nome:"Transporte",cor:"--c-transp",kw:["uber","99","taxi","gasolina","combustivel","etanol","alcool","diesel","gnv","abasteci","abastecimento","posto","onibus","metro","estacionamento","pedagio","oficina","mecanico","troca de oleo","oleo","pneu","lavagem","lava jato","seguro do carro","aluguel do carro","aluguel da moto","ipva","licenciamento","passagem","bilhete unico"]},
 {id:"saude",nome:"Saúde",cor:"--c-saude",kw:["farmacia","remedio","medico","consulta","exame","dentista","plano de saude","drogaria","academia","hospital","psicologo","terapia"]},
 {id:"lazer",nome:"Lazer e assinaturas",cor:"--c-lazer",kw:["cinema","bar","show","festa","viagem","netflix","spotify","streaming","assinatura","jogo","passeio","cerveja","churrasco","balada","hotel"]},
 {id:"educacao",nome:"Educação",cor:"--c-educ",kw:["escola","faculdade","curso","livro","mensalidade","material escolar","apostila"]},
 {id:"compras",nome:"Compras",cor:"--c-compras",kw:["roupa","loja","shopping","amazon","shopee","mercado livre","sapato","tenis","presente","magalu","eletronico","tv","televisao","geladeira","celular novo","notebook","movel","sofa","shein"]},
 {id:"pets",nome:"Pets",cor:"--c-pets",kw:["pet shop","petshop","pet","racao","veterinario","veterinaria","banho e tosa","cachorro","gato","areia do gato","vacina do cachorro"]},
 {id:"filhos",nome:"Filhos",cor:"--c-filhos",kw:["fralda","creche","brinquedo","mesada","pediatra","baba","leite em po","uniforme escolar","filho","filha","criancas"]},
 {id:"beleza",nome:"Beleza e cuidados",cor:"--c-beleza",kw:["salao","cabelo","cabeleireiro","barbeiro","barbearia","manicure","unha","maquiagem","perfume","estetica","depilacao","sobrancelha","cosmeticos"]},
 {id:"casa",nome:"Casa e manutenção",cor:"--c-casa",kw:["reforma","manutencao","material de construcao","eletricista","encanador","pedreiro","faxina","diarista","produto de limpeza","limpeza","conserto","ferramenta","utensilios"]},
 {id:"familia",nome:"Família e transferências",cor:"--c-familia",kw:["transferi","transferencia","mandei","enviei","ajuda","doacao","dizimo","oferta","mae","pai","irma","irmao","avo"]},
 {id:"impostos",nome:"Impostos e taxas",cor:"--c-impostos",kw:["imposto","taxa","multa","tarifa","anuidade","juros","mei","inss","irpf","imposto de renda","tarifa bancaria","cartorio"]},
 {id:"emprestimos",nome:"Empréstimos",cor:"--c-emprest",kw:["emprestimo","parcela do emprestimo","financiamento","consignado"]},
];
const OUTROS={id:"outros",nome:"Outros",cor:"--c-outros",kw:[]};
const CORES_X=["--c-x1","--c-x2","--c-x3","--c-x4","--c-x5","--c-x6"];
const CATS=[], CAT={};
function syncCats(){
  CATS.length=0; for(const k in CAT) delete CAT[k];
  const custom=((state.config&&state.config.cats)||[]).filter(c=>c&&c.id&&c.nome);
  [...BASE_CATS,...custom,OUTROS].forEach(c=>{ CATS.push(c); CAT[c.id]=c; });
}
const catOf=id=>CAT[id]||OUTROS;
// gastos que contam como "do trabalho" (carro/moto) para quem ganha por dia
const TRAB_KW=["gasolina","combustivel","etanol","alcool","diesel","gnv","abasteci","abastecimento","posto","pedagio","lavagem","lava jato","troca de oleo","oleo","pneu","mecanico","oficina","aluguel do carro","aluguel da moto","seguro do carro","estacionamento"];
const FORMAS={pix:"Pix",debito:"Débito",dinheiro:"Dinheiro",boleto:"Boleto"};
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MES3=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=v=>(Number(v)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const brl0=v=>(Number(v)||0).toLocaleString("pt-BR",{maximumFractionDigits:0});
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,"0");
const isoDate=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hojeISO=()=>isoDate(new Date());
const dOf=iso=>new Date(iso+"T12:00:00");
const addD=(iso,n)=>{ const d=dOf(iso); d.setDate(d.getDate()+n); return isoDate(d); };
const mk=(y,m)=>{ y+=Math.floor(m/12); m=((m%12)+12)%12; return y+"-"+pad(m+1); };
const mkOf=iso=>String(iso).slice(0,7);
const addM=(key,n)=>{ const [y,m]=key.split("-").map(Number); return mk(y,m-1+n); };
const mesNome=key=>{ const [y,m]=key.split("-").map(Number); return MESES[m-1]; };
const ddmm=iso=>String(iso).slice(8,10)+"/"+String(iso).slice(5,7);
const money=s=>brNum(String(s||"").replace(/[^\d.,]/g,""));
const sum=(a,f)=>a.reduce((s,x)=>s+(+(f?f(x):x.valor)||0),0);
const r2=v=>Math.round(v*100)/100;
const cap=s=>s&&!/^[a-z][A-Z]/.test(s)?s.charAt(0).toUpperCase()+s.slice(1):s; // mantém iFood, iPhone

let state={config:{},gastos:[],loaded:false};
let ym=(()=>{const d=new Date();return {y:d.getFullYear(),m:d.getMonth()}})();
let tab="inicio", pending=null;
let ui={seg:"contas",edit:null,add:null,limites:false,guardar:null,diaModo:"dias",q:"",fTipo:"",fAll:false,restore:null,pinForm:false,catForm:null,onb:null};
const curKey=()=>mk(ym.y,ym.m);
const cfg=()=>{ const c=state.config||(state.config={}); c.cards=c.cards||[];c.loans=c.loans||[];c.rendas=c.rendas||[];c.fixas=c.fixas||[];c.limites=c.limites||{};c.metas=c.metas||[];c.cats=c.cats||[];if(!c.diasSemana)c.diasSemana=6; return c; };

/* ============ armazenamento ============ */
const LS="caderneta-v1";
// Cada pessoa tem sua própria caderneta, privada: data/users/<id>/config e .../config/gastos
const store={kind:"local",db:null,base:null,
  async run(fn,fallback){
    if(this.db){ try{ await fn(); return; }catch(e){ if(e&&e.code==="invalid_argument"&&!this.wrote){ this.toLocal(); } else throw e; } }
    fallback(); saveLocal(); render();
  },
  toLocal(){ this.db=null; this.kind="local"; (this.unsubs||[]).forEach(u=>{try{u()}catch(_){}}); toast("Salvando só neste aparelho"); },
  async setConfig(c){ await this.run(async()=>{await this.db.doc(this.base).set(c);this.wrote=true}, ()=>{state.config=c}); },
  async saveGasto(g){ await this.run(async()=>{await this.db.doc(this.base).collection("gastos").doc(g.id).set(g);this.wrote=true}, ()=>{state.gastos=state.gastos.filter(x=>x.id!==g.id);state.gastos.push(g)}); },
  async delGasto(id){ await this.run(async()=>{await this.db.doc(this.base).collection("gastos").doc(id).delete()}, ()=>{state.gastos=state.gastos.filter(g=>g.id!==id)}); },
  // restaurar cópia: "substituir" apaga o que não está na cópia; "juntar" só acrescenta/atualiza
  async restore(config,gastos,modo,progress){
    if(!this.db){
      if(modo==="substituir"){ state.config=config; state.gastos=gastos.slice(); }
      else { state.config=juntarConfig(cfg(),config); const ids=new Set(gastos.map(g=>g.id)); state.gastos=state.gastos.filter(g=>!ids.has(g.id)).concat(gastos); }
      saveLocal(); render(); return;
    }
    const col=this.db.doc(this.base).collection("gastos");
    await this.db.doc(this.base).set(modo==="substituir"?config:juntarConfig(cfg(),config));
    let n=0;
    if(modo==="substituir"){ const keep=new Set(gastos.map(g=>g.id)); for(const g of state.gastos.slice()) if(!keep.has(g.id)){ await col.doc(g.id).delete(); } }
    for(const g of gastos){ await col.doc(g.id).set(g); n++; if(progress&&n%10===0) progress(n); }
    this.wrote=true;
  },
  async apagarTudo(){
    if(!this.db){ state.config={}; state.gastos=[]; saveLocal(); render(); return; }
    const col=this.db.doc(this.base).collection("gastos");
    for(const g of state.gastos.slice()) await col.doc(g.id).delete();
    await this.db.doc(this.base).set({});
  }
};
function juntarConfig(a,b){

  // categoria (a palavra mais longa que bater ganha)

    for(const c of CATS){ for(const k of (c.kw||[])){ const f=findWord(t,k); if(f&&(!best||k.length>best.k.length)) best={c:c.id,k,i:f.i,len:f.len}; } }
    // a descrição vem da primeira palavra da categoria escolhida ("ração do cachorro" → Ração)
    if(best){ for(const k of catOf(best.c).kw||[]){ const f=findWord(t,k); if(f&&(f.i<best.i||(f.i===best.i&&f.len>best.len))) Object.assign(best,{k,i:f.i,len:f.len}); } }
    if(best&&best.k==="celular"&&/\b(comprei|parcel|vezes)/.test(t)) best.c="compras";
    if(best){ r.cat=best.c; if(!r.desc&&!SEM_DESC.has(best.k)){ const o=recorte(p,best.i,best.len); r.desc=DM[best.k]&&norm(o)===best.k?DM[best.k]:cap(o); } }
  }
  // conta fixa ("paguei a luz", "paguei a internet")
  const fixaHit=C.fixas.find(f=>hasWord(t,norm(f.name)))||(r.cat&&C.fixas.filter(f=>f.cat===r.cat).length===1?C.fixas.find(f=>f.cat===r.cat):null);
  if(fixaHit&&/\b(paguei|pago|conta)\b/.test(t)){ r.fixa=fixaHit.id; r.cat=r.cat||fixaHit.cat; if(!r.desc||r.desc===DM.luz) r.desc=fixaHit.name; if(r.valor==null) r.valor=+fixaHit.valor; }
  // gasto do trabalho (carro/moto) para quem ganha por dia
  if(/\b(do trabalho|pro trabalho|pro carro|do carro|da moto|pra moto|pro app)\b/.test(t)) r.trabalho=true;
  else if(ehDiario()&&TRAB_KW.some(k=>hasWord(t,k))) r.trabalho=true;
  if(!r.cat){ r.cat="outros"; r.avisos.push("Não reconheci a categoria. Escolha abaixo."); }
  if(!r.desc) r.desc=cap(descDepoisDe(p,t,"no|na|em|com|de|uma?|pra|para|pro|pros|pras","no|na|pelo|pela|com|usando|via|de|em|e"))||catOf(r.cat).nome;
  if(r.valor==null) r.avisos.push("Não entendi o valor. Digite abaixo.");
  return r;
}

let samplerP=null; const sampler=()=>samplerP||(samplerP=IN_CLAUDE?window.claude.use("sample").catch(()=>null):Promise.resolve(null));
async function interpretarComIA(frase){
  const s=await sampler(); if(!s) throw {code:"not_granted"};
  const C=cfg();
  const prompt=`Você converte frases faladas em português do Brasil sobre dinheiro em lançamentos de um app de finanças pessoais.
Hoje é ${hojeISO()}.
Categorias de gasto (use o id): ${CATS.map(c=>c.id+" ("+c.nome+")").join(", ")}.
Cartões cadastrados: ${C.cards.map(c=>c.name).join(", ")||"nenhum"}.
Empréstimos: ${C.loans.map(l=>l.name).join(", ")||"nenhum"}.
Metas de economia: ${C.metas.map(m=>m.name).join(", ")||"nenhuma"}.
Responda SOMENTE com um array JSON. Cada item:
{"tipo":"gasto"|"entrada"|"guardado"|"jornada","valor":número total em reais (0 para jornada),"categoria":id (só gasto),"descricao":texto curto com acentos,"cartao":nome exato de um cartão ou null,"emprestimo":nome exato ou null,"meta":nome exato ou null,"parcelas":inteiro (1 se à vista),"data":"AAAA-MM-DD","horas":número ou 0,"km":número ou 0,"trabalho":true se for gasto do carro/moto de trabalho}
Valores aproximados ("uns 300") viram o número. "12x de 200" é valor 2400 com parcelas 12. Cada valor citado vira um item.
Frase: """${frase}"""`;
  const arr=await s.json(prompt,{modelTier:"quick"});
  if(!Array.isArray(arr)||!arr.length) throw {code:"empty"};
  return arr.map(x=>{
    const tipo=["gasto","entrada","guardado","jornada"].includes(x.tipo)?x.tipo:"gasto";
    const card=C.cards.find(c=>norm(c.name)===norm(x.cartao)), loan=C.loans.find(l=>norm(l.name)===norm(x.emprestimo)), meta=C.metas.find(m=>norm(m.name)===norm(x.meta));
    const r={tipo,valor:+x.valor||null,cat:tipo==="gasto"?(CAT[x.categoria]?x.categoria:"outros"):(tipo==="entrada"?"entrada":null),desc:cap(String(x.descricao||"").slice(0,60)),
      conta:card?card.id:loan?loan.id:null,forma:card?"cartao":loan?"emprestimo":"pix",data:/^\d{4}-\d{2}-\d{2}$/.test(x.data)?x.data:hojeISO(),
      parcelas:Math.max(1,Math.min(48,parseInt(x.parcelas)||1)),horas:+x.horas||0,km:+x.km||0,avisos:[],texto:frase,ia:true};
    if(tipo==="gasto"&&x.trabalho) r.trabalho=true;
    if(tipo==="guardado") r.meta=meta?meta.id:(C.metas[0]&&C.metas[0].id);
    if(loan) r.cat="emprestimos";
    if(tipo==="jornada"){ r.valor=0; r.desc="Jornada"; }
    return r;
  });
}

  };
}
function nomeConta(id,forma){ const C=cfg(); const c=C.cards.find(x=>x.id===id), l=C.loans.find(x=>x.id===id); return c?"Cartão "+c.name:l?l.name:(FORMAS[forma]||"Pix"); }
function alertaLimite(g){
  if(!g||g.tipo&&g.tipo!=="gasto") return null; const lim=+cfg().limites[g.cat]; if(!lim) return null;
  ITENS=expand(); const it=ITENS.find(i=>i.ref===g.id); const key=it?it.mes:mkOf(g.data);
  const tot=sum(gastosDe(key).filter(i=>i.cat===g.cat)); const pct=tot/lim*100;
  if(pct>=100) return `${catOf(g.cat).nome}: passou o limite de R$ ${brl0(lim)} (R$ ${brl(tot)})`;
  if(pct>=80) return `${catOf(g.cat).nome}: já usou ${Math.round(pct)}% do limite`;
  return null;
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function ouvir(){
  if(listening&&rec){rec.stop();return}
  if(!SR){ micFallback(); return; }
  try{
    rec=new SR(); rec.lang="pt-BR"; rec.interimResults=true; rec.maxAlternatives=1;
    rec.onstart=()=>{listening=true;$("#sheetMic").classList.add("on");$("#hint").classList.remove("alert");$("#hint").textContent="Ouvindo…"};
    rec.onresult=e=>{ let txt=""; for(const r of e.results) txt+=r[0].transcript; $("#sayInput").value=txt; if(e.results[e.results.length-1].isFinal){ showItens(interpretar(txt)); } };

// Meta diária: quanto ainda precisa ganhar por dia de trabalho para pagar o mês (gastos lançados + contas que faltam − renda fixa).
function metaDiaria(key){
  const hojeD=new Date(); if(key!==mkOf(hojeISO())) return null;
  if(!ehDiario()&&!entradasDe(key).length) return null;
  const C=cfg(), hj=hojeISO(), {fixo}=ganhoDe(key);
  const custo=sum(gastosDe(key))+sum(pendentesDe(key))+sum(guardadosDe(key));
  const antes=sum(entradasDe(key).filter(i=>i.dia<hj)), feitoHoje=sum(entradasDe(key).filter(i=>i.dia===hj));

  const dim=new Date(hojeD.getFullYear(),hojeD.getMonth()+1,0).getDate(), restam=dim-hojeD.getDate()+1;

function chart6(key){

  const data=ms.map(m=>{ const g=ganhoDe(m); return {m,ganho:g.fixo+g.extra,gasto:sum(gastosDe(m))}; });
  if(!data.some(d=>d.ganho||d.gasto)) return `<div class="empty">O gráfico aparece quando houver lançamentos.</div>`;
  const W=340,H=170,L=36,R=6,T=14,B=26, max=Math.max(...data.map(d=>Math.max(d.ganho,d.gasto)))||1;
  const step=Math.pow(10,Math.floor(Math.log10(max))); const nice=Math.ceil(max/step)*step; const ticks=[0,nice/2,nice];
  const y=v=>T+(H-T-B)*(1-v/nice), cw=(W-L-R)/6, bw=Math.min(16,cw*0.32);
  const kfmt=v=>v>=1000?(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+"k":brl0(v);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ganhos e gastos dos últimos 6 meses">`;
  ticks.forEach(t=>{ s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${kfmt(t)}</text>`; });
  data.forEach((d,i)=>{ const cx=L+cw*i+cw/2, cur=d.m===key;
    if(d.ganho) s+=`<rect x="${cx-bw-1}" y="${y(d.ganho)}" width="${bw}" height="${y(0)-y(d.ganho)}" rx="3" fill="var(--accent)" opacity="${cur?1:.55}"><title>Ganhos R$ ${brl(d.ganho)}</title></rect>`;
    if(d.gasto) s+=`<rect x="${cx+1}" y="${y(d.gasto)}" width="${bw}" height="${y(0)-y(d.gasto)}" rx="3" fill="${d.gasto>d.ganho&&d.ganho?"var(--danger)":"var(--c-alim)"}" opacity="${cur?1:.55}"><title>Gastos R$ ${brl(d.gasto)}</title></rect>`;
    const mm=+d.m.split("-")[1];
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="${cur?"var(--fg)":"var(--muted)"}" font-weight="${cur?700:500}">${MES3[mm-1]}</text>`; });
  s+=`</svg>`;
  const pos=data.filter(d=>d.ganho).map(d=>d.ganho-d.gasto);
  const media=pos.length?pos.reduce((a,b)=>a+b,0)/pos.length:null;
  return `<div class="chart-wrap"><div class="legend"><span><i style="background:var(--accent)"></i>Ganhos</span><span><i style="background:var(--c-alim)"></i>Gastos</span><span><i style="background:var(--danger)"></i>Gastou mais que ganhou</span></div>${s}
    ${media!=null?`<p class="hint">Sobra média: <b class="${media<0?"neg":"pos"}">R$ ${brl(media)}</b> por mês.</p>`:""}</div>`;
}

  }

/* ---------- Histórico: busca, filtro e edição ---------- */
let filtroSig="";
function atualizaFiltro(){
  const C=cfg(), sig=CATS.map(c=>c.id).join()+"|"+C.cards.map(c=>c.id+c.name).join();
  if(sig===filtroSig) return; filtroSig=sig; const sel=$("#fTipo"), v=ui.fTipo;
  sel.innerHTML=`<option value="">Tudo</option><option value="t:gasto">Gastos</option><option value="t:entrada">Ganhos</option><option value="t:trabalho">Gastos do trabalho</option><option value="t:guardado">Guardado em metas</option><option value="t:jornada">Jornadas</option>
    <optgroup label="Categorias">${CATS.map(c=>`<option value="c:${esc(c.id)}">${esc(c.nome)}</option>`).join("")}</optgroup>
    ${C.cards.length?`<optgroup label="Cartões">${C.cards.map(c=>`<option value="k:${esc(c.id)}">Cartão ${esc(c.name)}</option>`).join("")}</optgroup>`:""}`;
  sel.value=v; if(sel.value!==v){ ui.fTipo=""; sel.value=""; }
}
function filtra(i){
  const f=ui.fTipo;
  if(f==="t:gasto"&&i.tipo!=="gasto") return false;
  if(f==="t:trabalho"&&!(i.tipo==="gasto"&&isTrab(i))) return false;
  if(f&&f.startsWith("t:")&&!["t:gasto","t:trabalho"].includes(f)&&i.tipo!==f.slice(2)) return false;
  if(f.startsWith("c:")&&!(i.tipo==="gasto"&&i.cat===f.slice(2))) return false;
  if(f.startsWith("k:")&&i.conta!==f.slice(2)) return false;
  const q=norm(ui.q).trim(); if(!q) return true;
  const meta=i.tipo==="guardado"?((cfg().metas.find(m=>m.id===i.meta)||{}).name||""):"";
  const txt=norm([i.desc,i.tipo==="gasto"?catOf(i.cat).nome:"",i.tipo==="gasto"?nomeConta(i.conta,i.forma):"",meta,i.tipo==="entrada"?"ganho entrada":"",brl(i.total||i.valor)].join(" "));
  return q.split(/\s+/).every(w=>txt.includes(w));
}
function renderLanc(key){

  let base=ui.fAll?ITENS.filter(i=>!(i.parcela>1)):ITENS.filter(i=>mkOf(i.dia)===key);
  const all=base.filter(filtra);
  let h=`<div class="row-actions"><button class="btn small" data-export="mes">Exportar ${MESES[ym.m]} (planilha)</button><button class="btn small ghost" data-export="tudo">Exportar tudo</button></div>`;
  if(filtrando||ui.fAll){ const gs=sum(all.filter(i=>i.tipo==="gasto")), gn=sum(all.filter(i=>i.tipo==="entrada"));
    h+=`<p class="hint">${all.length} lançamento${all.length===1?"":"s"}${ui.fAll?" em todos os meses":` em ${MESES[ym.m]}`}${gs?` · gastos R$ ${brl(gs)}`:""}${gn?` · ganhos R$ ${brl(gn)}`:""}</p>`; }
  if(!all.length){ p.innerHTML=h+`<div class="empty">${filtrando?"Nada encontrado com esse filtro.":`Nenhum lançamento em ${MESES[ym.m]}.`}</div>`; return; }
  const sorted=[...all].sort((a,b)=>String(b.dia).localeCompare(a.dia)||(b.criado||0)-(a.criado||0)).slice(0,300);
  let last="";
  for(const g of sorted){
    if(g.dia!==last){ last=g.dia; h+=`<div class="day">${dOf(g.dia).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:ui.fAll&&g.dia.slice(0,4)!==String(new Date().getFullYear())?"numeric":undefined})}</div>`; }
    const del=`<button class="del" aria-label="Apagar lançamento" data-delg="${esc(g.ref)}">×</button>`;
    const open=`data-edit="${esc(g.ref)}" role="button" tabindex="0"`;
    if(g.tipo==="entrada"){ h+=`<div class="tx" ${open}><span class="dot" style="background:var(--accent)"></span><div class="t"><b>${esc(g.desc)}</b><span>Ganho</span></div><span class="num pos">+ R$ ${brl(g.valor)}</span>${del}</div>`; continue; }
    if(g.tipo==="guardado"){ const m=cfg().metas.find(x=>x.id===g.meta); h+=`<div class="tx" ${open}><span class="dot" style="background:var(--accent)"></span><div class="t"><b>Guardado: ${esc(m?m.name:g.desc)}</b><span>Meta de economia</span></div><span class="num">R$ ${brl(g.valor)}</span>${del}</div>`; continue; }
    if(g.tipo==="jornada"){ h+=`<div class="tx" ${open}><span class="dot" style="background:var(--muted)"></span><div class="t"><b>Jornada</b><span>${g.horas?numIn(g.horas)+" horas":""}${g.horas&&g.km?" · ":""}${g.km?brl0(g.km)+" km":""}</span></div><span></span>${del}</div>`; continue; }

  }
  if(all.length>300) h+=`<p class="hint">Mostrando os 300 mais recentes. Use a busca para achar os outros.</p>`;
  h+=`<p class="hint">Toque num lançamento para editar.</p>`;
  p.innerHTML=h;
}

/* ============ PIN ============ */
const PINK="caderneta-pin";
const pinGet=()=>{ try{ return JSON.parse(localStorage.getItem(PINK)||"null"); }catch(_){ return null; } };
async function pinHash(pin,salt){
  try{ if(crypto&&crypto.subtle){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pin)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); } }catch(_){}
  let h=7; for(const ch of salt+":"+pin) h=(h*31+ch.charCodeAt(0))|0; return "f"+h;
}
async function pinSet(pin){ const salt=uid()+uid(); localStorage.setItem(PINK,JSON.stringify({s:salt,h:await pinHash(pin,salt),n:pin.length})); }
let locked=false, typed="", erros=0, esperaAte=0, saiuEm=0, esqueci=false;
function lockNow(){ if(!pinGet()) return; locked=true; typed=""; esqueci=false; drawLock(""); $("#lock").hidden=false; document.body.classList.add("sheet-open"); }
function unlock(){ locked=false; typed=""; erros=0; $("#lock").hidden=true; if($("#sheet").hidden) document.body.classList.remove("sheet-open"); }
function drawLock(msg){
  const P=pinGet(); const n=P?P.n:4;
  if(esqueci){ $("#lock").innerHTML=`<h2>Esqueceu o PIN?</h2><p class="hint" style="max-width:320px;text-align:center">Para entrar sem o PIN, ${store.kind==="db"?"o PIN deste aparelho será desligado. Seus dados continuam na sua conta.":"os dados deste aparelho serão apagados. Se você tem uma cópia de segurança, dá para restaurar depois em Ajustes."}</p>
    <div class="row-actions" style="justify-content:center"><button class="btn danger" id="lockReset">${store.kind==="db"?"Desligar PIN e entrar":"Apagar dados e entrar"}</button><button class="btn" id="lockBack">Voltar</button></div>`; return; }
  $("#lock").innerHTML=`<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <h2>Digite seu PIN</h2><div class="dots" aria-label="${typed.length} de ${n} números">${Array.from({length:n},(_,i)=>`<i class="${i<typed.length?"on":""}"></i>`).join("")}</div>
    <div class="msg" role="alert">${esc(msg||"")}</div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-k="${d}">${d}</button>`).join("")}<button class="txt" data-k="esqueci">Esqueci</button><button data-k="0">0</button><button class="txt" data-k="apagar" aria-label="Apagar">⌫</button></div>`;
}
async function teclaPin(k){
  if(Date.now()<esperaAte){ drawLock(`Aguarde ${Math.ceil((esperaAte-Date.now())/1000)} segundos.`); return; }
  const P=pinGet(); if(!P){ unlock(); return; }
  if(k==="apagar"){ typed=typed.slice(0,-1); drawLock(""); return; }
  if(k==="esqueci"){ esqueci=true; drawLock(""); return; }
  if(!/^\d$/.test(k)||typed.length>=P.n) return;
  typed+=k; drawLock("");
  if(typed.length===P.n){
    const ok=(await pinHash(typed,P.s))===P.h;
    if(ok){ unlock(); return; }
    erros++; typed="";
    if(erros>=5){ esperaAte=Date.now()+30000; erros=0; drawLock("Muitas tentativas. Aguarde 30 segundos."); }
    else drawLock("PIN errado. Tente de novo.");
  }
}
$("#lock").addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.k) return teclaPin(b.dataset.k);
  if(b.id==="lockBack"){ esqueci=false; drawLock(""); }
  if(b.id==="lockReset"){ try{ localStorage.removeItem(PINK); if(store.kind!=="db"){ localStorage.removeItem(LS); state.config={}; state.gastos=[]; } }catch(_){} unlock(); render(); toast(store.kind==="db"?"PIN desligado":"Dados deste aparelho apagados"); }
});
document.addEventListener("keydown",e=>{ if(!locked) return; if(/^\d$/.test(e.key)) teclaPin(e.key); else if(e.key==="Backspace") teclaPin("apagar"); });
document.addEventListener("visibilitychange",()=>{ if(document.hidden) saiuEm=Date.now(); else if(pinGet()&&!locked&&saiuEm&&Date.now()-saiuEm>60000) lockNow(); });

/* ============ lembretes (versão instalada) ============ */
const NOTIF_K="caderneta-notif";
// próximas contas e faturas a vencer, guardadas onde o serviço do app consegue ler com o app fechado
function agenda(){
  const out=[], hoje=hojeISO(), C=cfg();
  for(const off of [0,1]){ const key=addM(mkOf(hoje),off), [y,m]=key.split("-").map(Number), gm=gastosDe(key);
    for(const f of C.fixas){ if(!+f.dia||gm.some(g=>g.fixa===f.id)) continue; out.push({id:"f-"+f.id+"-"+key,titulo:f.name,valor:+f.valor||0,vence:isoDate(new Date(y,m-1,Math.min(+f.dia,28)))}); }
    for(const c of C.cards){ if(!+c.vence) continue; const tot=sum(gm.filter(g=>g.conta===c.id)); if(tot>0) out.push({id:"c-"+c.id+"-"+key,titulo:"Fatura "+c.name,valor:tot,vence:isoDate(new Date(y,m-1,Math.min(+c.vence,28)))}); }
  }
  return out.filter(a=>a.vence>=hoje&&a.vence<=addD(hoje,7));
}
let agendaSig="";
function escreverAgenda(){
  if(!APP||!("caches" in window)) return; let on=false; try{on=localStorage.getItem(NOTIF_K)==="1"}catch(_){}
  if(!on) return; const a=JSON.stringify(agenda()); if(a===agendaSig) return; agendaSig=a;
  caches.open("caderneta-agenda").then(c=>c.put("agenda.json",new Response(a,{headers:{"content-type":"application/json"}}))).catch(()=>{});
}
async function ligarNotif(){
  if(!("Notification" in window)||!("serviceWorker" in navigator)){ toast("Este celular não permite notificações aqui."); return; }
  const perm=await Notification.requestPermission(); if(perm!=="granted"){ toast("Permissão de notificação negada. Libere nas configurações do Android."); return; }
  let modo="aberto";
  try{ const reg=await navigator.serviceWorker.ready;
    if(reg.periodicSync){ await reg.periodicSync.register("contas",{minInterval:12*3600*1000}); modo="auto"; }
    const prox=agenda().filter(a=>a.vence<=addD(hojeISO(),2));
    reg.showNotification("Lembretes ligados",{body:prox.length?prox.map(a=>`${a.titulo}: R$ ${brl(a.valor)} (${quando(diasAte(a.vence))})`).join("\n"):"Você vai ser avisado quando uma conta estiver perto de vencer.",icon:"icons/icon-192.png",badge:"icons/icon-192.png",tag:"caderneta-on"});
  }catch(_){}
  try{ localStorage.setItem(NOTIF_K,"1"); localStorage.setItem(NOTIF_K+"-modo",modo); }catch(_){}
  agendaSig=""; escreverAgenda(); render();
}
async function desligarNotif(){ try{ localStorage.removeItem(NOTIF_K); const reg=await navigator.serviceWorker.ready; if(reg.periodicSync) await reg.periodicSync.unregister("contas"); }catch(_){} render(); }

/* ============ cópia de segurança e planilha ============ */
async function baixar(nome,data,tipo){
  if(IN_CLAUDE){ let dl=null; try{ dl=await window.claude.use("downloads"); }catch(_){}
    if(dl){ try{ await dl.save({filename:nome,data}); return true; }catch(e){ if(e&&e.code==="declined"){ toast("Download cancelado"); return false; } } } }
  else { try{ const url=URL.createObjectURL(new Blob([data],{type:tipo})); const a=document.createElement("a"); a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); return true; }catch(_){} }
  try{ await navigator.clipboard.writeText(data.replace(/^﻿/,"")); toast("Não deu para baixar aqui, então copiei o conteúdo."); return true; }catch(_){ toast("Não foi possível salvar aqui."); return false; }
}
const backupJSON=()=>JSON.stringify({app:"caderneta",formato:1,versao:VERSAO_APP,exportado:new Date().toISOString(),config:cfg(),gastos:state.gastos});
const backupNome=()=>`caderneta-copia-${hojeISO()}.json`;
async function salvarBackup(){ if(await baixar(backupNome(),backupJSON(),"application/json")){ try{localStorage.setItem("caderneta-ultimo-backup",hojeISO())}catch(_){} toast("Cópia salva"); render(); } }
async function enviarBackup(){
  try{ const f=new File([backupJSON()],backupNome(),{type:"application/json"}); if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:"Cópia da Caderneta"}); try{localStorage.setItem("caderneta-ultimo-backup",hojeISO())}catch(_){} render(); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  salvarBackup();
}
function lerArquivoBackup(file){
  const fr=new FileReader();
  fr.onload=()=>{ try{
      const d=JSON.parse(String(fr.result||""));
      if(!d||d.app!=="caderneta"||typeof d.config!=="object"||!Array.isArray(d.gastos)) throw 0;
      const gastos=d.gastos.filter(g=>g&&typeof g==="object"&&typeof g.id==="string"&&g.id&&typeof g.data==="string");
      ui.restore={config:d.config||{},gastos,quando:d.exportado?new Date(d.exportado).toLocaleDateString("pt-BR"):"data desconhecida"};
      tab="ajustes"; render();
    }catch(_){ toast("Esse arquivo não é uma cópia da Caderneta."); } };
  fr.onerror=()=>toast("Não deu para abrir o arquivo.");
  fr.readAsText(file);
}
function csv(itens){
  const q=v=>{ v=String(v??""); return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const num=v=>(Number(v)||0).toFixed(2).replace(".",",");
  const head=["Data","Mês de referência","Tipo","Categoria","Descrição","Pago com","Parcela","Trabalho","Valor (R$)","Horas","Km"];
  const tipoN={gasto:"Gasto",entrada:"Ganho",guardado:"Guardado em meta",jornada:"Jornada"};
  const rows=itens.sort((a,b)=>String(a.dia).localeCompare(b.dia)).map(g=>[
    String(g.dia).split("-").reverse().join("/"), g.mes.split("-").reverse().join("/"), tipoN[g.tipo]||g.tipo,
    g.tipo==="gasto"?catOf(g.cat).nome:"", g.tipo==="guardado"?((cfg().metas.find(m=>m.id===g.meta)||{}).name||g.desc):g.desc,
    g.tipo==="gasto"?nomeConta(g.conta,g.forma):"", g.de?`${g.parcela}/${g.de}`:"", g.tipo==="gasto"&&isTrab(g)?"sim":"", g.tipo==="gasto"?"-"+num(g.valor):num(g.valor), g.horas?num(g.horas):"", g.km||""]);
  return "﻿"+[head,...rows].map(r=>r.map(q).join(";")).join("\r\n");
}
async function exportar(modo){
  const itens=modo==="mes"?doMes(curKey()):ITENS.slice();
  if(!itens.length){ toast("Nada para exportar"); return; }
  if(await baixar(modo==="mes"?`caderneta-${curKey()}.csv`:"caderneta-completa.csv",csv(itens),"text/csv;charset=utf-8")) toast("Planilha pronta");
}

/* ============ eventos ============ */
document.querySelector(".tabbar").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(b){tab=b.dataset.tab;render();window.scrollTo(0,0)}});
$("#gear").onclick=()=>{ tab="ajustes"; render(); window.scrollTo(0,0); };
$("#prevM").onclick=()=>{ym.m--;if(ym.m<0){ym.m=11;ym.y--}render()};
$("#nextM").onclick=()=>{ym.m++;if(ym.m>11){ym.m=0;ym.y++}render()};
const cfgCopy=()=>JSON.parse(JSON.stringify(cfg()));
function arm(t,label){ if(t.dataset.armed) return true; t.dataset.armed="1"; t.textContent=label||"Confirmar"; setTimeout(()=>{ if(t.isConnected&&t.dataset.armed){ delete t.dataset.armed; render(); } },3500); return false; }
const fechaForms=()=>{ ui.add=null; ui.edit=null; };
function pagarFixa(f){ const key=curKey(), dt=key===mkOf(hojeISO())?hojeISO():key+"-"+pad(Math.min(28,+f.dia||1));
  openSheet(); showEditor({tipo:"gasto",valor:+f.valor,cat:f.cat||"outros",desc:f.name,data:dt,conta:null,forma:"pix",fixa:f.id,avisos:[],parcelas:1,texto:"Paguei "+f.name},{frase:`Conta fixa: ${f.name}. Ajuste o valor se veio diferente.`}); }
function pagarLoan(l){ const key=curKey(), dt=key===mkOf(hojeISO())?hojeISO():key+"-"+pad(Math.min(28,new Date().getDate()));
  openSheet(); showEditor({tipo:"gasto",valor:+l.parcela,cat:"emprestimos",desc:"Parcela "+l.name,data:dt,conta:l.id,forma:"emprestimo",avisos:[],parcelas:1,texto:""},{frase:`Parcela do empréstimo ${l.name}.`}); }
document.addEventListener("change",async e=>{
  const id=e.target.id;
  try{
  if(id==="diasSemana"){ const c=cfgCopy(); c.diasSemana=+e.target.value; await store.setConfig(c); }
  else if(id==="modoSel"){ const c=cfgCopy(); if(e.target.value) c.modo=e.target.value; else delete c.modo; await store.setConfig(c); }
  else if(id==="fTipo"){ ui.fTipo=e.target.value; render(); }
  else if(id==="fAll"){ ui.fAll=e.target.checked; render(); }
  else if(id==="restoreFile"){ const f=e.target.files&&e.target.files[0]; if(f) lerArquivoBackup(f); e.target.value=""; }
  }catch(_){ toast("Não foi possível salvar. Tente de novo."); }
});
let qT=null; $("#q").addEventListener("input",e=>{ ui.q=e.target.value; clearTimeout(qT); qT=setTimeout(()=>renderLanc(curKey()),120); });
$("#p-lanc").addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.matches(".tx[data-edit]")){ e.preventDefault(); editar(e.target.dataset.edit); } });
document.addEventListener("click",async e=>{
  const row=e.target.closest(".tx[data-edit]");
  if(row&&!e.target.closest("button")){ editar(row.dataset.edit); return; }
  const t=e.target.closest("button"); if(!t||t.closest("#lock")||t.closest("#onb")) return;
  const d=t.dataset, C=cfg();
  try{
  if(d.add){ const k=d.add; ui.edit=null; ui.add=ui.add===k?null:k; render(); const f=document.querySelector(`#${{card:"cardForm",loan:"loanForm",fixa:"fixaForm",meta:"metaForm"}[k]} input`); if(f) f.focus(); }
  else if(d.editk){ ui.add=null; ui.edit={k:d.editk,id:d.editid}; render(); const f=document.querySelector(`#${{card:"cardForm",loan:"loanForm",fixa:"fixaForm",meta:"metaForm",renda:"rendaForm"}[d.editk]}`); if(f){ f.scrollIntoView({block:"center"}); const i=f.querySelector("input"); if(i) i.focus(); } }
  else if(d.cancelform){ fechaForms(); render(); }
  else if(d.edit&&!row){ editar(d.edit); }
  else if(d.ai!=null){ t.disabled=true; t.textContent="Pensando…";
    try{ const itens=await interpretarComIA(d.ai); itens.frase=d.ai; showItens(itens); }
    catch(err){ t.disabled=false; t.textContent=err&&err.code==="rate_limited"?"IA ocupada, tente daqui a pouco":err&&err.code==="not_granted"?"IA não disponível aqui":"A IA não entendeu. Ajuste à mão."; } }
  else if(t.id==="toggleLim"){ ui.limites=!ui.limites; render(); }
  else if(d.seg){ ui.seg=d.seg; fechaForms(); render(); }
  else if(d.diamodo){ ui.diaModo=d.diamodo; render(); }
  else if(d.go){ tab=d.go; if(d.goseg) ui.seg=d.goseg; render(); window.scrollTo(0,0); }
  else if(t.id==="pickFixo"){ tab="carteira"; ui.seg="renda"; render(); window.scrollTo(0,0); const n=$("#nrName"); if(n) n.focus(); }
  else if(t.id==="pickDia"){ openSheet("Hoje ganhei 280 no Uber e gastei 90 de gasolina"); const h=$("#hint"); h.classList.remove("alert");
    h.textContent="Diga quanto ganhou e quanto gastou no dia, tudo numa frase só. Pode incluir horas e km rodados."; $("#sayInput").focus(); }
  else if(d.export){ await exportar(d.export); }
  else if(d.guardar!=null){ ui.guardar=d.guardar||null; render(); const v=$("#gvVal"); if(v) v.focus(); }
  else if(d.payfixa){ const f=C.fixas.find(x=>x.id===d.payfixa); if(f) pagarFixa(f); }
  else if(d.payloan){ const l=C.loans.find(x=>x.id===d.payloan); if(l) pagarLoan(l); }
  else if(d.delg){ const g=state.gastos.find(x=>x.id===d.delg); if(!arm(t,"✓")){ toast("Toque de novo para apagar "+(g?g.desc:"")+(g&&g.parcelas>1?" (todas as parcelas)":"")); return; } await store.delGasto(d.delg); toast("Lançamento apagado"); }
  else if(d.delrenda){ if(!arm(t)) return; const c=cfgCopy(); c.rendas=c.rendas.filter(x=>x.id!==d.delrenda); await store.setConfig(c); toast("Renda removida"); }
  else if(d.delcard){ if(!arm(t,"Confirmar remoção")) return; const c=cfgCopy(); c.cards=c.cards.filter(x=>x.id!==d.delcard); await store.setConfig(c); toast("Cartão removido. Os gastos continuam no histórico."); }
  else if(d.delloan){ if(!arm(t,"Confirmar remoção")) return; const c=cfgCopy(); c.loans=c.loans.filter(x=>x.id!==d.delloan); await store.setConfig(c); toast("Empréstimo removido"); }
  else if(d.delfixa){ if(!arm(t)) return; const c=cfgCopy(); c.fixas=c.fixas.filter(x=>x.id!==d.delfixa); await store.setConfig(c); toast("Conta fixa removida"); }
  else if(d.delmeta){ if(!arm(t)) return; const c=cfgCopy(); c.metas=c.metas.filter(x=>x.id!==d.delmeta); await store.setConfig(c); toast("Meta removida"); }
  else if(d.delcat){ if(!arm(t)) return; const c=cfgCopy(); c.cats=c.cats.filter(x=>x.id!==d.delcat); await store.setConfig(c); toast("Categoria removida. Os gastos dela aparecem em Outros."); }
  else if(d.editcat){ ui.catForm=d.editcat; render(); const n=$("#ctNome"); if(n) n.focus(); }
  else if(t.id==="clearEx"){ if(!arm(t)) return; t.disabled=true;
    for(const g of state.gastos.filter(x=>x.exemplo)) await store.delGasto(g.id);
    const c=cfgCopy(); ["cards","loans","rendas","fixas","metas"].forEach(k=>c[k]=c[k].filter(x=>!x.exemplo));
    if(c.limitesExemplo){ c.limites={}; delete c.limitesExemplo; }
    await store.setConfig(c); toast("Exemplos apagados. Agora é com você!"); }
  else if(t.id==="saveBackup") await salvarBackup();
  else if(t.id==="shareBackup") await enviarBackup();
  else if(t.id==="pickRestore") $("#restoreFile").click();
  else if(d.restore!=null){ const r=ui.restore; if(!d.restore||!r){ ui.restore=null; render(); return; }
    if(d.restore==="substituir"&&!arm(t,"Toque de novo para substituir")) return;
    ui.restore=null; toast("Restaurando…");
    await store.restore(r.config,r.gastos,d.restore,n=>toast(`Restaurando… ${n} de ${r.gastos.length}`));
    render(); toast(`Cópia restaurada: ${r.gastos.length} lançamentos`); }
  else if(t.id==="pinOn"){ ui.pinForm=true; render(); $("#pin1").focus(); }
  else if(t.id==="pinOff"){ if(!arm(t,"Toque de novo para desligar")) return; try{localStorage.removeItem(PINK)}catch(_){} render(); toast("PIN desligado"); }
  else if(t.id==="notifOn") await ligarNotif();
  else if(t.id==="notifOff") await desligarNotif();
  else if(t.id==="apagarTudo"){ if(!arm(t,"Toque de novo para apagar tudo")) return; await store.apagarTudo(); ui.onb=null; render(); toast("Todos os dados foram apagados"); }
  }catch(err){ toast("Não foi possível salvar. Tente de novo."); }
});
document.addEventListener("submit",async e=>{
  const f=e.target; e.preventDefault(); const id=f.dataset.id||"";
  const salvaLista=async(k,obj,msg)=>{ const c=cfgCopy(); if(id){ const x=c[k].find(q=>q.id===id); if(x) Object.assign(x,obj); } else c[k].push(Object.assign({id:k[0]+uid()},obj)); fechaForms(); await store.setConfig(c); toast(msg); };
  try{
  if(f.id==="rendaForm"){ const name=$("#rendaForm #nrName")?f.querySelector("#nrName").value.trim():""; const v=money(f.querySelector("#nrVal").value); if(!name||!(v>0)){toast("Informe nome e valor");return}
    await salvaLista("rendas",{name,valor:r2(v)},"Renda "+name+" salva"); }
  else if(f.id==="cardForm"){ const name=$("#ncName").value.trim(); if(!name)return;
    await salvaLista("cards",{name,limite:money($("#ncLim").value)||0,fecha:($("#ncFecha").value||"").replace(/\D/g,"").slice(0,2),vence:($("#ncVence").value||"").replace(/\D/g,"").slice(0,2)},"Cartão "+name+" salvo"); }
  else if(f.id==="loanForm"){ const name=$("#nlName").value.trim(); const parc=money($("#nlParc").value); if(!name||!(parc>0)){toast("Informe nome e parcela");return}
    await salvaLista("loans",{name,parcela:r2(parc),restantes:parseInt($("#nlRest").value)||0,desde:Date.now()},"Empréstimo salvo"); }
  else if(f.id==="fixaForm"){ const name=$("#nfName").value.trim(); const v=money($("#nfVal").value); if(!name||!(v>0)){toast("Informe nome e valor");return}
    await salvaLista("fixas",{name,valor:r2(v),dia:($("#nfDia").value||"").replace(/\D/g,"").slice(0,2),cat:$("#nfCat").value},"Conta "+name+" salva"); }
  else if(f.id==="metaForm"){ const name=$("#nmName").value.trim(); const alvo=money($("#nmAlvo").value); if(!name||!(alvo>0)){toast("Informe nome e objetivo");return}
    await salvaLista("metas",{name,alvo:r2(alvo),inicial:money($("#nmIni").value)||0,prazo:$("#nmPrazo").value||""},"Meta salva"); }
  else if(f.id==="catForm"){ const nome=$("#ctNome").value.trim(); if(!nome){toast("Dê um nome à categoria");return}
    const kwOrig=$("#ctKw").value.split(",").map(s=>s.trim()).filter(Boolean).slice(0,30); const kw=[norm(nome),...kwOrig.map(norm)].filter((v,i,a)=>v&&a.indexOf(v)===i);
    const c=cfgCopy(); const obj={nome,kw,kwOrig,cor:$("#ctCor").value};
    if(id){ const x=c.cats.find(q=>q.id===id); if(x) Object.assign(x,obj); } else c.cats.push(Object.assign({id:"u"+uid()},obj));
    ui.catForm=null; await store.setConfig(c); toast("Categoria "+nome+" salva"); }
  else if(f.id==="guardarForm"){ const v=money($("#gvVal").value); if(!(v>0)){toast("Informe o valor");return}
    const m=cfg().metas.find(x=>x.id===f.dataset.meta); await store.saveGasto({id:uid(),tipo:"guardado",valor:r2(v),meta:f.dataset.meta,desc:m?m.name:"Guardado",data:hojeISO(),criado:Date.now()}); ui.guardar=null; render(); toast(`R$ ${brl(v)} guardados em ${m?m.name:"sua meta"}`); }
  else if(f.id==="limForm"){ const c=cfgCopy(); const lim={}; f.querySelectorAll("[data-lim]").forEach(i=>{ const v=money(i.value); if(v>0) lim[i.dataset.lim]=r2(v); }); c.limites=lim; delete c.limitesExemplo; ui.limites=false; await store.setConfig(c); toast("Limites salvos"); }
  else if(f.id==="pinForm"){ const a=$("#pin1").value, b=$("#pin2").value;
    if(!/^\d{4,6}$/.test(a)){ toast("O PIN precisa ter de 4 a 6 números"); return; } if(a!==b){ toast("Os dois PINs estão diferentes"); return; }
    await pinSet(a); ui.pinForm=false; render(); toast("PIN ativado"); }
  }catch(err){ toast("Não foi possível salvar. Tente de novo."); }
});

render(); initStore();
if(APP&&"serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
})();
