/* ============ assinatura (Google Play) ============ */
// Só vale na versão instalável. O arquivo assinatura.json, na raiz do site, liga a cobrança e diz onde está o servidor.
// Sem o arquivo (404) ou com "ativo": false, o Din funciona inteiro, como antes.
// Com a cobrança ligada: teste grátis de N dias e, depois, só lê e faz backup quem não assina.
// Proteções: (1) toda liberação é um "selo" assinado pelo servidor e conferido com a chave pública abaixo, então
// mexer no que fica salvo no navegador não libera nada; (2) se o assinatura.json for bloqueado, o app assume a
// cobrança ligada; (3) o teste grátis conta a partir do 1º lançamento feito depois de ligar a cobrança, então apagar
// o registro do teste não o reinicia; (4) atrasar o relógio do celular não estende teste nem assinatura.
var ASS_LS="din-assinatura", ASS_INI="din-teste-inicio", ASS_REL="din-relogio", PLAY_BILLING="https://play.google.com/billing";
var ASS_PUB={"kty":"EC","crv":"P-256","x":"Yn28D1RUCtB5U1hlWtTxh5MRi58Q27ZMuCPo67H-0LQ","y":"1D4XlDCDPHSHO7K16ikp5Yf307o-o84lv8JdaiPJ2YY"};
var assCfg=null, assDG=null, assDetalhe=null, assUi={codigo:false,ocupado:false}, assPronto=false, assCarregado=false, assSync=0;
var assSelo=null, assProvisorio=0, assChave=null;
const lsJ=k=>{ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(_){ return null; } };
const lsS=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(_){} };
const ASS_DATA_VERSAO="2026-11-11";   // data desta versão: lançamentos de antes dela nunca contam para o teste
const ASS_FECHADA={ativo:true,servidor:"",produto:"din_mensal",pacote:"",testeDias:7,preco:"R$ 5,00",desde:ASS_DATA_VERSAO};   // quando o arquivo some de propósito
const assAtiva=()=>!!(APP&&assCfg&&assCfg.ativo===true);
const assProduto=()=>String((assCfg&&assCfg.produto)||"din_mensal");
const assPacote=()=>String((assCfg&&assCfg.pacote)||"");
const assServidor=()=>String((assCfg&&assCfg.servidor)||"").replace(/\/+$/,"");
const testeDias=()=>{ const n=parseInt(assCfg&&assCfg.testeDias,10); return Math.max(0,isNaN(n)?7:n); };
// "desde" = dia em que a cobrança foi ligada (no assinatura.json); sem ele, vale a data desta versão
const desdeMs=()=>{ let d=String((assCfg&&assCfg.desde)||""); if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||d<ASS_DATA_VERSAO) d=ASS_DATA_VERSAO; return new Date(d+"T00:00:00").getTime(); };
const FOLGA_ASS=3*864e5;   // sem internet ou renovação atrasada: mantém liberado por mais 3 dias
// "agora" que não anda para trás: o maior entre o relógio, o maior horário já visto e o horário do servidor no selo
function agora(){ return Math.max(Date.now(),+lsJ(ASS_REL)||0,assSelo&&+assSelo.iat||0); }
function marcarRelogio(){ const t=agora(); if(t>(+lsJ(ASS_REL)||0)) lsS(ASS_REL,t); }
// lançamentos feitos depois de ligar a cobrança: o primeiro marca o início do teste, o último impede voltar o relógio
function lancamentosDoTeste(){ const d=desdeMs(); let min=Infinity, max=0;
  for(const g of state.gastos){ const c=+g.criado||0; if(c>=d&&c>0){ if(c<min) min=c; if(c>max) max=c; } }
  return {min,max}; }
function testeInicio(){ let t=+lsJ(ASS_INI)||0; const l=lancamentosDoTeste();
  if(!t&&assAtiva()){ t=Math.min(Date.now(),l.min); lsS(ASS_INI,t); }
  return Math.min(t||Date.now(),l.min); }
// dias que faltam no teste grátis (0 = acabou)
const testeResta=()=>{ const ref=Math.max(agora(),lancamentosDoTeste().max); return Math.max(0,Math.ceil((testeInicio()+testeDias()*864e5-ref)/864e5)); };
function assEstado(){ const x=assSelo, s=lsJ(ASS_LS)||{}; return {tipo:x?x.t:null,exp:x?+x.exp||0:0,pendente:!!s.pendente}; }
function assinante(){
  if(assProvisorio>Date.now()) return true;
  const x=assSelo; if(!x) return false;
  if(x.t==="cod") return (+x.exp||0)+FOLGA_ASS>agora();
  return x.t==="ass"&&x.prod===assProduto()&&(+x.exp||0)+FOLGA_ASS>agora();
}
const travado=()=>assCarregado&&assAtiva()&&!assinante()&&testeResta()<=0;
const PERIODO={P1W:"semana",P1M:"mês",P3M:"3 meses",P6M:"6 meses",P1Y:"ano"};
function assPreco(){
  const d=assDetalhe; let p=(assCfg&&assCfg.preco)||"R$ 5,00", per="mês";
  if(d&&d.price&&d.price.value!=null){ try{ p=new Intl.NumberFormat("pt-BR",{style:"currency",currency:d.price.currency||"BRL"}).format(+d.price.value); }catch(_){} }
  if(d&&d.subscriptionPeriod&&PERIODO[d.subscriptionPeriod]) per=PERIODO[d.subscriptionPeriod];
  return {p:String(p).replace(/R\$\s*/,"R$\u00a0"),per};   // “R$” não se separa do valor na quebra de linha
}
const linkLoja=()=>assPacote()?"https://play.google.com/store/apps/details?id="+encodeURIComponent(assPacote()):"";
const linkGerenciar=()=>"https://play.google.com/store/account/subscriptions"+(assPacote()?`?sku=${encodeURIComponent(assProduto())}&package=${encodeURIComponent(assPacote())}`:"");

// ---------- selos ----------
const deB64=t=>{ const b=atob(String(t).replace(/-/g,"+").replace(/_/g,"/")+"===".slice((String(t).length+3)%4)); return Uint8Array.from(b,c=>c.charCodeAt(0)); };
async function conferirSelo(selo){
  if(typeof selo!=="string"||selo.length>2000) return null;
  const [corpo,sig]=selo.split("."); if(!corpo||!sig) return null;
  try{
    if(!assChave) assChave=await crypto.subtle.importKey("jwk",ASS_PUB,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
    const ok=await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},assChave,deB64(sig),new TextEncoder().encode(corpo));
    return ok?JSON.parse(new TextDecoder().decode(deB64(corpo))):null;
  }catch(_){ return null; }
}
async function guardarSelo(selo,extra){
  const x=await conferirSelo(selo); if(!x) return false;
  // o horário do servidor manda: se o celular já esteve adiantado, corrige a marca guardada
  if(x.iat&&(+lsJ(ASS_REL)||0)>+x.iat+2*864e5) lsS(ASS_REL,Math.max(+x.iat,Date.now()));
  assSelo=x; lsS(ASS_LS,Object.assign({selo,verificado:Date.now()},extra||{})); marcarRelogio(); return true;
}
function limparSelo(extra){ if(assSelo&&assSelo.t==="cod") return; assSelo=null; lsS(ASS_LS,Object.assign({verificado:Date.now()},extra||{})); }

// ---------- conversa com o servidor e com a Google Play ----------
async function assPost(rota,corpo){
  const srv=assServidor(); if(!srv) return null;
  const ctl=typeof AbortController!=="undefined"?new AbortController():null, tm=ctl?setTimeout(()=>ctl.abort(),15000):0;
  try{ const r=await fetch(srv+rota,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(corpo),signal:ctl?ctl.signal:undefined});
    const j=await r.json().catch(()=>null); return r.ok?j:null; }
  catch(_){ return null; } finally{ if(tm) clearTimeout(tm); }
}
// confirma a compra no servidor (que também avisa o Google que recebeu, senão o Google devolve o dinheiro em 3 dias)
async function verificarCompra(token){
  const j=await assPost("/verificar",{token,produto:assProduto()}); if(!j) return null;
  if(j.ativo&&!(await guardarSelo(j.selo))) return null;      // resposta sem selo válido não vale
  if(!j.ativo) limparSelo({pendente:!!j.pendente});
  return j;
}
async function sincronizarCompras(avisar){
  if(!assDG) return;
  // ao abrir o app, confirma no máximo a cada 6 horas (a não ser que a pessoa peça)
  const s0=lsJ(ASS_LS)||{};
  if(!avisar&&assSelo&&assSelo.t==="ass"&&Date.now()-(+s0.verificado||0)<6*36e5&&(+assSelo.exp||0)>agora()) return;
  if(!avisar&&Date.now()-assSync<6e4) return; assSync=Date.now();
  let compras; try{ compras=await assDG.listPurchases(); }catch(_){ if(avisar) toast("Não deu para falar com a Google Play agora."); return; }
  const minhas=(compras||[]).filter(c=>c&&c.itemId===assProduto());
  if(!minhas.length){ if(assSelo&&assSelo.t==="ass") limparSelo(); if(avisar) toast("Nenhuma assinatura ativa nesta conta Google."); return; }
  let algum=null;
  for(const c of minhas){ const r=await verificarCompra(c.purchaseToken); if(r&&r.ativo){ algum=r; break; } if(r) algum=algum||r; }
  if(avisar) toast(algum&&algum.ativo?"Assinatura encontrada. Tudo liberado!":algum&&algum.pendente?"Pagamento pendente. O Din libera assim que a Google Play confirmar.":algum?"A assinatura desta conta não está ativa.":"Não deu para confirmar agora. Tente de novo mais tarde.");
}
// selo de código vale 60 dias; renova sozinho quando faltam menos de 45 (se o código ainda estiver na lista)
async function renovarCodigo(){
  if(!assSelo||assSelo.t!=="cod"||(+assSelo.exp||0)-agora()>45*864e5) return;
  const s=lsJ(ASS_LS)||{}; const j=await assPost("/renovar",{selo:s.selo});
  if(j&&j.ok) await guardarSelo(j.selo);
}
async function carregarConfig(){
  try{ const r=await fetch("assinatura.json",{cache:"no-store"});
    if(r.status===404) return null;                                   // arquivo ainda não enviado: cobrança desligada
    if(!r.ok) return ASS_FECHADA;
    const j=await r.json(); return j&&typeof j==="object"?j:ASS_FECHADA; }
  catch(_){ return ASS_FECHADA; }                                     // bloqueado ou sem resposta: assume ligada
}
async function iniciarAssinatura(){
  if(!APP) return;
  assCfg=await carregarConfig();
  const s=lsJ(ASS_LS)||{}; if(s.selo) assSelo=await conferirSelo(s.selo);
  if(assSelo&&assSelo.t==="ass"&&assSelo.prod!==assProduto()) assSelo=null;
  assCarregado=true; marcarRelogio();
  if(!assAtiva()){ render(); return; }
  testeInicio();
  if("getDigitalGoodsService" in window){
    try{ assDG=await window.getDigitalGoodsService(PLAY_BILLING); }catch(_){ assDG=null; }
    if(assDG){ try{ const d=await assDG.getDetails([assProduto()]); assDetalhe=(d&&d[0])||null; }catch(_){} await sincronizarCompras(false); }
  }
  await renovarCodigo();
  render();
  let visto=false; try{ visto=sessionStorage.getItem("din-paywall-visto")==="1"; }catch(_){}
  if(travado()&&!visto&&!locked&&cfg().onboarded){ try{ sessionStorage.setItem("din-paywall-visto","1"); }catch(_){} abrirPaywall(); }
}
async function assinar(btn){
  if(!assDG){ toast("A assinatura é feita no app do Din baixado da Google Play."); return; }
  if(!window.PaymentRequest){ toast("Este celular não abriu a compra. Atualize o Chrome e tente de novo."); return; }
  assUi.ocupado=true; if(btn){ btn.disabled=true; btn.textContent="Abrindo a Google Play…"; }
  try{
    const req=new PaymentRequest([{supportedMethods:PLAY_BILLING,data:{sku:assProduto()}}],{total:{label:"Total",amount:{currency:"BRL",value:"0"}}});
    const resp=await req.show();
    const token=resp&&resp.details&&resp.details.purchaseToken;
    const r=token?await verificarCompra(token):null;
    if(token&&!r) assProvisorio=Date.now()+864e5;   // servidor fora do ar: libera nesta sessão e confirma na próxima abertura
    try{ await resp.complete(token?"success":"fail"); }catch(_){}
    if(!token) toast("A compra não foi concluída.");
    else if(r&&r.pendente) toast("Pagamento pendente. O Din libera assim que a Google Play confirmar.");
    else if(r&&!r.ativo) toast("A Google Play não confirmou a assinatura. Tente “Já assinei”.");
    else { toast("Assinatura ativa. Obrigado por apoiar o Din!"); fecharPaywall(); }
  }catch(e){ if(!e||e.name!=="AbortError") toast("A compra não foi concluída. Tente de novo."); }
  assUi.ocupado=false; render(); pintarPaywall();
}
async function usarCodigo(c){
  c=String(c||"").trim(); if(!c){ toast("Digite o código"); return; }
  if(!assServidor()){ toast("Códigos ainda não estão disponíveis."); return; }
  const j=await assPost("/codigo",{codigo:c});
  if(j&&j.ok&&await guardarSelo(j.selo)){ assUi.codigo=false; toast("Código aceito. Din liberado neste aparelho."); fecharPaywall(); render(); }
  else toast(j?"Código inválido.":"Sem conexão com o servidor. Tente de novo.");
}

// ---------- tela de assinatura ----------
function paywallHTML(){
  const {p,per}=assPreco(), s=assEstado(), play=!!assDG, rest=testeResta(), sou=assinante();
  let tit, sub;
  if(sou&&s.tipo==="cod"){ tit="Din liberado"; sub="Este aparelho usa um código de acesso. Está tudo liberado."; }
  else if(sou){ tit="Você é assinante"; sub=`Obrigado por apoiar o Din!${s.tipo==="ass"&&s.exp?` Próxima renovação em ${new Date(s.exp).toLocaleDateString("pt-BR")}.`:""}`; }
  else if(rest>0){ tit="Você está no teste grátis"; sub=`Falta${rest===1?"":"m"} ${rest} dia${rest===1?"":"s"}. Depois, para continuar lançando, é só assinar.`; }
  else { tit="Seu teste grátis acabou"; sub="Seus dados continuam aqui: dá para ver tudo e fazer backup. Para lançar, editar e usar o Din completo, assine."; }
  if(s.pendente&&!sou) sub+=" Há um pagamento pendente na Google Play.";
  const itens=["Lançar por voz e por texto","Contas a pagar e a receber, com lembretes","Saldo das contas e previsão do mês","Cartões, faturas, metas e resumo do ano","Importar extrato do banco"];
  const cta=sou?(s.tipo==="cod"?"":`<a class="btn wide" href="${esc(linkGerenciar())}" target="_blank" rel="noopener">Gerenciar ou cancelar assinatura</a>`)
    :play?`<button class="btn primary wide" data-ass="assinar" ${assUi.ocupado?"disabled":""}>Assinar por ${esc(p)}/${per}</button>`
    :linkLoja()?`<a class="btn primary wide" href="${esc(linkLoja())}" target="_blank" rel="noopener">Assinar pelo app na Google Play</a>`:"";
  const letra=sou?"":play?`Cobrança de ${esc(p)} por ${per} pela Google Play. Renova sozinha até você cancelar. Cancele quando quiser no app da Play Store, em Pagamentos e assinaturas.`
    :"A assinatura é feita no app do Din baixado da Google Play (Android). Depois de assinar lá, toque em “Já assinei” no app.";
  return `<div class="grab"></div>
    <div class="sheet-top"><h3>Din</h3><button class="icon-btn" data-ass="fechar" aria-label="Fechar">×</button></div>
    <div class="pw-head"><h2>${tit}</h2><p class="hint">${sub}</p></div>
    ${sou?"":`<div class="pw-preco"><b class="num">${esc(p)}</b><span>por ${per}</span></div>
    <ul class="pw-lista">${itens.map(i=>`<li>${i}</li>`).join("")}</ul>`}
    ${cta}
    ${letra?`<p class="hint pw-letra">${letra}</p>`:""}
    ${sou?"":`<div class="row-actions pw-acoes">${play?`<button class="btn small ghost" data-ass="restaurar">Já assinei</button>`:""}<button class="btn small ghost" data-ass="codigo">Tenho um código</button></div>`}
    ${assUi.codigo&&!sou?`<form class="pw-codigo" id="assCodigoForm"><label class="field"><span class="label">Código de acesso</span><input id="assCodigo" autocomplete="off" autocapitalize="none" spellcheck="false"></label><button class="btn primary">Usar código</button></form>`:""}`;
}
function pintarPaywall(){ const el=document.getElementById("paywall"); if(el&&!el.hidden) el.querySelector(".sheet-inner").innerHTML=paywallHTML(); }
function abrirPaywall(){
  if(!assAtiva()) return;
  let el=document.getElementById("paywall");
  if(!el){ el=document.createElement("div"); el.className="sheet paywall"; el.id="paywall"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); el.setAttribute("aria-label","Assinatura do Din");
    el.innerHTML=`<button class="sheet-bg" data-ass="fechar" aria-label="Fechar" tabindex="-1"></button><div class="sheet-in"><div class="sheet-inner"></div></div>`; document.body.appendChild(el); }
  el.hidden=false; document.body.classList.add("sheet-open"); pintarPaywall();
}
function fecharPaywall(){ const el=document.getElementById("paywall"); if(!el||el.hidden) return; el.hidden=true; assUi.codigo=false; if($("#sheet").hidden) document.body.classList.remove("sheet-open"); }

// aviso no Início e seção em Ajustes
function assinaturaAjustesHTML(){
  if(!assPronto||!assAtiva()) return "";
  const s=assEstado(), sou=assinante(), rest=testeResta(), {p,per}=assPreco();
  const st=sou?(s.tipo==="cod"?"Liberado com código de acesso.":`Assinante.${s.tipo==="ass"&&s.exp?` Renova em ${new Date(s.exp).toLocaleDateString("pt-BR")}.`:""}`)
    :rest>0?`Teste grátis: falta${rest===1?"":"m"} ${rest} dia${rest===1?"":"s"}.`:"Teste grátis encerrado. Você pode ver seus dados e fazer backup.";
  return `<div class="sec">Assinatura</div><div class="set">
    <div class="sw"><div><h3>Din ${sou?"completo":`por ${esc(p)}/${per}`}</h3><p class="hint">${st}</p></div>
    <button class="btn small ${sou?"":"primary"}" data-ass="abrir">${sou?"Detalhes":"Assinar"}</button></div></div>`;
}
function renderAssinatura(){
  if(!APP||!assPronto) return;
  let ban=document.getElementById("assBanner");
  if(!ban){ ban=document.createElement("div"); ban.id="assBanner"; const v=$("#v-inicio"); if(v) v.insertBefore(ban,v.firstChild); }
  const trav=travado(), rest=assAtiva()&&!assinante()?testeResta():99, {p,per}=assPreco();
  const mic=$("#mic"); if(mic){ mic.classList.toggle("trav",trav); mic.setAttribute("aria-label",trav?"Lançar por voz (precisa assinar)":"Lançar por voz"); }
  if(!assAtiva()||(!trav&&rest>3)){ ban.hidden=true; ban.innerHTML=""; }
  else { ban.hidden=false; ban.className="ass-banner"+(trav?" trav":"");
    ban.innerHTML=`<div><b>${trav?"Seu teste grátis acabou":`Seu teste grátis acaba ${rest===1?"amanhã":`em ${rest} dias`}`}</b>
      <span>${trav?`Seus dados estão salvos. Para lançar e editar, assine por ${esc(p)}/${per}.`:`Depois, o Din custa ${esc(p)}/${per}.`}</span></div>
      <button class="btn small primary" data-ass="abrir">${trav?"Assinar":"Ver"}</button>`; }
  pintarPaywall();
}

// ---------- travas: com o teste encerrado e sem assinatura, nada é gravado ----------
const ASS_BLOQ='#mic,#sheetMic,#pickDia,#pickFixo,[data-add],[data-editk],[data-edit],[data-guardar],[data-payfixa],[data-payloan],[data-payfat],[data-recrenda],[data-recx],#novaTransf,[data-ajuste],[data-padrao],'+
  '[data-delconta],[data-delrec],[data-delg],[data-delrenda],[data-delcard],[data-delloan],[data-delfixa],[data-delmeta],[data-delcat],[data-editcat],#pickImport,[data-imp],#clearEx,#pickRestore,[data-restore],#toggleLim,[data-ai],#examples button';
if(APP){
  document.addEventListener("click",e=>{
    const a=e.target.closest("[data-ass]");
    if(a){ const k=a.dataset.ass; e.preventDefault(); e.stopImmediatePropagation();
      if(k==="abrir") abrirPaywall(); else if(k==="fechar") fecharPaywall(); else if(k==="assinar") assinar(a);
      else if(k==="restaurar"){ a.disabled=true; a.textContent="Procurando…"; sincronizarCompras(true).then(()=>{ render(); pintarPaywall(); if(assinante()) fecharPaywall(); }); }
      else if(k==="codigo"){ assUi.codigo=!assUi.codigo; pintarPaywall(); const i=$("#assCodigo"); if(i) i.focus(); }
      return; }
    if(!travado()) return;
    const el=e.target.closest(ASS_BLOQ); if(!el||el.closest("#paywall")) return;
    e.preventDefault(); e.stopImmediatePropagation(); abrirPaywall();
  },true);
  document.addEventListener("submit",e=>{
    const f=e.target;
    if(f.id==="assCodigoForm"){ e.preventDefault(); e.stopImmediatePropagation(); const b=f.querySelector("button"); b.disabled=true; usarCodigo($("#assCodigo").value).finally(()=>{ b.disabled=false; }); return; }
    if(!travado()||f.id==="pinForm") return;
    e.preventDefault(); e.stopImmediatePropagation(); abrirPaywall();
  },true);
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){ const el=document.getElementById("paywall"); if(el&&!el.hidden){ fecharPaywall(); e.stopImmediatePropagation(); return; } }
    if(travado()&&(e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".tx[data-edit]")){ e.preventDefault(); e.stopImmediatePropagation(); abrirPaywall(); }
  },true);
  document.addEventListener("change",e=>{
    if(travado()&&["diasSemana","modoSel","importFile","restoreFile"].includes(e.target.id)){ e.stopImmediatePropagation(); abrirPaywall(); render(); }
  },true);
  // segunda barreira: mesmo que algum botão escape, o armazenamento não grava
  const barra=()=>{ abrirPaywall(); const e=new Error("assinatura"); e.code="assinatura"; return e; };
  for(const m of ["saveGasto","delGasto","restore"]){ const orig=store[m]; store[m]=async function(...a){ if(travado()) throw barra(); return orig.apply(this,a); }; }
  const setCfg=store.setConfig; store.setConfig=async function(c,interno){ if(!interno&&travado()) throw barra(); return setCfg.call(this,c); };
  window.addEventListener("unhandledrejection",e=>{ if(e.reason&&e.reason.code==="assinatura") e.preventDefault(); });
  document.addEventListener("visibilitychange",()=>{ if(document.hidden||!assCarregado) return; marcarRelogio(); if(assDG) sincronizarCompras(false).then(render); });
}
assPronto=true;

if(pinGet()) lockNow();
render(); initStore(); iniciarAssinatura();
if(APP&&"serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
})();

</script>
